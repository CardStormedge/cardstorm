// data/intelligence/image-registry.json is the single source of truth for
// every verified image mapping across Product Intelligence, Grail Board,
// Team Hunt and Watchlist. resolveCsImage() is the one lookup function every
// feature calls instead of duplicating per-feature image logic. When no
// verified entry/asset exists it returns null and callers render
// csFallbackTile() - one consistent premium branded placeholder design used
// everywhere in the app (see .csFallback CSS below), never a broken-image
// icon or blank tile.
let _imageRegistryPromise=null;
function loadImageRegistry(){
 if(!_imageRegistryPromise)_imageRegistryPromise=fetch('data/intelligence/image-registry.json').then(r=>r.json()).catch(()=>({entries:[]}));
 return _imageRegistryPromise;
}
let _imageRegistryCache=null;
loadImageRegistry().then(d=>{_imageRegistryCache=d.entries||[]});
function resolveCsImage(query){
 // query: {entityType, sport, year, player, product, set}
 if(!_imageRegistryCache)return null;
 const hit=_imageRegistryCache.find(e=>{
  if(query.entityType&&e.entityType!==query.entityType)return false;
  if(query.sport&&e.sport!==query.sport)return false;
  if(query.year!=null&&e.year!=null&&String(e.year)!==String(query.year))return false;
  if(query.player&&e.player!==query.player)return false;
  if(query.product&&e.product!==query.product)return false;
  if(query.set&&e.set!==query.set)return false;
  return true;
 });
 if(!hit)return null;
 const src=hit.repoAsset||hit.imageUrl;
 if(!src||hit.verificationStatus==='NO_VERIFIED_CARD_IMAGE_AVAILABLE')return {entry:hit,src:null};
 return {entry:hit,src};
}

// a real image exists: looks up the centralized registry via
// resolveCsImage() first, and only drops to the shared csFallbackTile()
// design when the registry has no usable src for this query.
function csImageBlock(query,fallbackOpts,imgAttrs){

 if(hit&&hit.src){
  const alt=csEsc((fallbackOpts&&fallbackOpts.title)||query.player||query.product||'');
  return `<img class="${(imgAttrs&&imgAttrs.cls)||'csResolvedImg'}" src="${hit.src}" loading=lazy decoding=async alt="${alt}">`;
 }

}

function renderGameBoard(){const host=document.getElementById('gameBoard');if(!host)return;const complete=gameRound>GAME_ROUNDS;host.innerHTML=`<div class=gamehud><div class=gamestat><span>ROUND</span><b>${complete?GAME_ROUNDS:gameRound} / ${GAME_ROUNDS}</b></div><div class=gamestat><span>TOTAL SCORE</span><b>${gameScore} / 1000</b></div><div class=gamestat><span>MAX PER ROUND</span><b>100</b></div><div class=gamestat><span>MISSION</span><b>RANK 3</b></div></div><div class=roundbar><div style="width:${Math.min(100,((complete?GAME_ROUNDS:gameRound-1)/GAME_ROUNDS)*100)}%"></div></div>${complete?`<div class="gameresult good gamecomplete"><h2>⚡ 10-ROUND CHALLENGE COMPLETE</h2><p>Your final CardStorm score is <b>${gameScore} / 1000</b>.</p><div id=leaderSubmit class=leadersubmit><input id=leaderName maxlength=24 placeholder="Name / collector handle"><button class=cta onclick="saveLeaderboard()">ADD TO LEADERBOARD</button><button class=cta onclick="resetChallenge()">PLAY 10 ROUNDS AGAIN</button></div></div><div id=leaderHost>${leaderboardHTML()}</div>`:`<div class=gameinstructions>Round ${gameRound}: click the cards from <b>highest value to lowest value</b>. Each round draws a new three-card matchup from CardStorm's verified comp pool.</div><div class=gamecards>${gameOrder.map(c=>{const n=gamePicked.indexOf(c.id)+1;return `<div class="gamecard ${n?'selected':''}" onclick="pickGame('${c.id}')">${n?`<div class=rankbadge>${n}</div>`:''}${gameVisual(c)}<div class=k style="margin-top:10px">CARD ${String.fromCharCode(65+gameOrder.indexOf(c))}</div><div class=teamname>${c.player}</div><div class=target>${c.card}</div><div class=target>${c.grade}</div></div>`}).join('')}</div><div class=gameactions><button class=cta onclick="undoGame()" ${gamePicked.length&&!roundLocked?'':'disabled'}>UNDO</button><button class=cta onclick="revealGame()" ${gamePicked.length===3&&!roundLocked?'':'disabled'}>LOCK IN & SCORE ROUND</button></div><div id=gameResult></div><div id=leaderHost>${leaderboardHTML()}</div>`}`}
function revealGame(){if(roundLocked||gamePicked.length!==3)return;roundLocked=true;const pts=pairScore();gameScore+=pts;const correct=[...gameRoundCards].sort((a,b)=>b.value-a.value);const r=document.getElementById('gameResult');r.className='gameresult '+(pts===100?'good':'bad');r.innerHTML=`<h2>${pts===100?'⚡ PERFECT ROUND':'STORM CHECK'} — +${pts} POINTS</h2><p>${pts===100?'You ranked every matchup correctly.':'Points are based on the three head-to-head value comparisons you ranked correctly.'}</p><div class=valuegrid>${correct.map((c,i)=>`<div class=valuebox><div class=k>#${i+1}</div><b>${c.player}</b><div>${c.card}</div><div class=valueprice>$${c.value.toLocaleString(undefined,{minimumFractionDigits:c.value%1?2:0,maximumFractionDigits:2})}</div><div class=target>${c.grade}</div><p class=target>${c.why||'Verified CardStorm comp.'}</p></div>`).join('')}</div><button class="cta nextRound" onclick="nextGameRound()">${gameRound===GAME_ROUNDS?'FINISH & VIEW SCORE':'NEXT ROUND →'}</button>`}

const INSIGHT_DATA={
'Product Heat':{text:'See which products are attracting collector attention, which rookie classes are driving demand, and where recent sales concentration is forming.',actions:[['OPEN SETS & PACKS','sets'],['OPEN MARKET RADAR','market']]},
'Player Momentum':{text:'Compare recent sale direction, player demand and chase-card activity. This becomes much stronger when the eBay comp feed is connected.',actions:[['OPEN MARKET RADAR','market'],['OPEN WATCHLIST','watch']]},

'Break Value':{text:'Evaluate break cost against checklist depth, team/player concentration and current card values before buying into a break.',actions:[['OPEN BREAKS','breaks'],['OPEN SETS & PACKS','sets']]}
};

function insights(){return shell('AI INSIGHTS','Powered by CardStorm AI','Click an intelligence module to open the collector guidance behind it.',`<div class=teamgrid>${Object.keys(INSIGHT_DATA).map(x=>`<div class="teamcard aiCard" style="grid-template-columns:1fr" onclick="openInsight('${x}')"><div><div class=teamname>${x}</div><div class=target>${INSIGHT_DATA[x].text}</div><div class=aiOpen>OPEN INTELLIGENCE →</div></div></div>`).join('')}</div>`)}
const F={team,sets,market,live,breaks,plans,game,watch,checks,insights};
let navStack=[];
// Every real navigation (show() or any open*() drill-down) calls navPush() exactly once
// before rendering. navPush() is therefore the single choke point where we also create a
// matching real browser history entry, so navStack and history.length stay in lockstep and
// the native browser Back button and the on-page BACK button drive the exact same restore
// logic via the popstate listener below - no more divergence between "our" back state and
// the browser's real history stack.
function navPush(){if(V.style.display!=='none'&&C.innerHTML)navStack.push({home:false,html:C.innerHTML,hash:location.hash,scroll:C.scrollTop});else navStack.push({home:true});if(navStack.length>30)navStack.shift();history.pushState({cardstormDepth:navStack.length},'',location.hash||location.pathname)}
function restoreFromNavStack(){const s=navStack.pop();if(!s||s.home){goHome();return}H.style.display='none';V.style.display='block';C.innerHTML=s.html;C.scrollTop=s.scroll||0}
window.addEventListener('popstate',restoreFromNavStack);
function goBack(){
 // If we have no in-app history to return to, never fall through to history.back(): on a
 // direct/deep link (e.g. a shared link or a search-result click straight into #pokemon), the
 // browser's real previous entry can be an external page (a search results page, etc). Routing
 // to goHome() here keeps every Back press inside CardStorm, matching the popstate/navStack
 // guarantee below.
 if(!navStack.length){goHome();return}
 history.back()
}
function show(v){navPush();H.style.display='none';V.style.display='block';C.innerHTML=(F[v]||team)();C.scrollTop=0;history.replaceState(history.state,'','#'+v)}
// Single source of truth for "home": app.html is the tool layer embedded by index.html's
// CardStorm homepage. Every logo/Home/Back-to-CardStorm control routes through here instead
// of ever re-showing the retired #home/#homeNew legacy dashboard below.
function inCardStormFrame(){try{return window.top!==window.self&&typeof window.parent.closeApp==='function'}catch(e){return false}}
function goHome(){
 navStack=[];
 if(inCardStormFrame()){
  try{
   // Prefer the parent's own goHome() — it closes the overlay AND resets scroll/hero
   // state on the real homepage. Falling back to closeApp() alone left the homepage
   // scrolled wherever the user had left it (reported as "returns halfway down the hero").
   if(typeof window.parent.goHome==='function'){window.parent.goHome();return}
   window.parent.closeApp();return
  }catch(e){}
 }
 try{window.top.location.href='index.html'}catch(e){window.location.href='index.html'}
}
if(location.hash){
 // This script block runs before later <script> blocks in the document have executed, so
 // route handlers they define/attach to F (pokemon, watch, askCardstorm, legends/goatlegacy,
 // checks -> renderChecklistLibrary, etc.) are not yet available here. Without deferring, a
 // direct/deep link or a hard refresh on one of those routes either silently rendered Team
 // Hunt instead (F[init] fell back to `team`) or threw a ReferenceError and left the page
 // blank (checks -> renderChecklistLibrary). setTimeout(fn,0) is NOT safe here — Chromium can
 // yield to the timer queue mid-parse on a document this large, running the callback before
 // the later script blocks that populate F have executed. DOMContentLoaded only fires once
 // the whole document (all inline scripts included) has finished parsing, so it's the
 // reliable point to run this. Normal in-app show() navigation is unaffected either way.
 const runInitialRoute=()=>{const init=location.hash.slice(1);navStack=[];H.style.display='none';V.style.display='block';C.innerHTML=(F[init]||team)();
  // Deep-link entry bypasses show()/navPush(), so without this the very first real browser
  // history entry for this tab is whatever page linked here (e.g. a search engine results
  // page). Push one sentinel "home" entry now so the native/hardware Back button - not just the
  // on-screen BACK control - always lands on a same-document popstate we control, and can never
  // fall straight through to that external referrer. See goBack()/restoreFromNavStack above.
  navStack=[{home:true}];history.pushState({cardstormDepth:1},'',location.hash);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',runInitialRoute);
 else runInitialRoute();
}
else if(!inCardStormFrame()){goHome();}

</script>

let checklistFilter='All';
function moneyNum(s){return Number(String(s||'').replace(/[$,]/g,''))||0}
function itemVerifiedComps(item){if(!item.match)return[];return COMPS.filter(c=>c[0]===item.player && c[2].includes(item.match))}
function itemValue(item){const cs=itemVerifiedComps(item);if(!cs.length)return null;return cs.reduce((a,c)=>a+moneyNum(c[1]),0)/cs.length}
function loadOwned(){try{return JSON.parse(localStorage.getItem('cardstormOwnedChecklist')||'{}')}catch(e){return{}}}
function saveOwned(x){localStorage.setItem('cardstormOwnedChecklist',JSON.stringify(x))}
function toggleOwned(id,checked){const o=loadOwned();if(checked)o[id]=true;else delete o[id];saveOwned(o);refreshCollectionUI()}
function setChecklistFilter(f){checklistFilter=f;document.querySelectorAll('.checkfilters button').forEach(b=>b.classList.toggle('active',b.dataset.f===f));document.querySelectorAll('.collectorcard').forEach(el=>{el.style.display=(f==='All'||el.dataset.type===f)?'grid':'none'})}
function collectionStats(){const o=loadOwned();let verified=0,pending=0,count=0;const rows=[];COLLECTION_ITEMS.forEach(it=>{if(!o[it.id])return;count++;const v=itemValue(it);if(v==null)pending++;else verified+=v;rows.push({it,v})});return{verified,pending,count,rows}}

function collectionChecks(){const owned=loadOwned();setTimeout(()=>{setChecklistFilter(checklistFilter);refreshCollectionUI()},0);return shell('CHECKLISTS','Own it. Check it. Value it.','Only Rated Rookies, Inserts and Case Hits are collectible here. Your checked cards stay saved in this browser.',`<div class=collectiontop><div class=feature><div class=k>COLLECTOR CHECKLIST</div><h2>Rated Rookies • Inserts • Case Hits</h2><p class=sub>Check the box only when you own that card. CardStorm uses exact, source-backed recent comps where available. Cards without a verified exact comp remain in your collection with value pending.</p><div class=checkfilters>${['All','Rated Rookie','Insert','Case Hit'].map(f=>`<button data-f="${f}" class="${f===checklistFilter?'active':''}" onclick="setChecklistFilter('${f}')">${f}</button>`).join('')}</div></div><div class=collectionvalue><div class=k>MY COLLECTION VALUE</div><div class=total id=collectionTotal>$0.00</div><div class=valuationnote>Verified subtotal from exact loaded comps. Multiple recent exact comps are averaged.</div><div class=metricrow><div class=metric>Cards checked<b id=collectionCount>0</b></div><div class=metric>Value pending<b id=collectionPending>0</b></div><div class=metric>Pricing basis<b>Verified comps</b></div></div><div class=ownedlist id=ownedList></div></div></div><div class=collectorgrid>${COLLECTION_ITEMS.map(it=>{const comps=itemVerifiedComps(it),v=itemValue(it);return `<label class="collectorcard ${owned[it.id]?'owned':''}" data-type="${it.type}"><input class=owncheck type=checkbox ${owned[it.id]?'checked':''} onchange="toggleOwned('${it.id}',this.checked)"><div><div class=collectortype>${it.type.toUpperCase()} • ${it.sport.toUpperCase()} • ${it.year}</div><h3>${it.player}</h3><div class=target>${it.card}</div>${v==null?`<div class=pendingval>VALUE PENDING</div><div class=valuationnote>No exact verified recent comp loaded yet.</div>`:`<div class=compval>$${v.toLocaleString(undefined,{minimumFractionDigits function playerSportV83(n){for(const [s,teams] of Object.entries(DATA)){for(const t of teams){if(t[2].includes(n))return s}}return 'unknown'}
function setMarketSport(s){marketSport=s;C.innerHTML=market()}
function market(){
 const filtered=marketSport==='all'?COMPS:COMPS.filter(c=>playerSportV83(c[0])===marketSport);
 const rows=filtered.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[2]}</td><td>${c[3]}</td><td class=price>${c[1]}</td><td>${c[4]}</td><td>${c[5]}</td><td><a class=verify href="${c[6]}" target="_blank">VERIFY →</a></td></tr>`).join('')||`<tr><td colspan=7><div class=notice>No source-backed ${marketSport} comps are loaded yet. This is a data gap, not an error. The live/eBay feed will populate this view.</div></td></tr>`;
 const players=[...new Set(WATCHCAT.map(x=>x[0]))].filter(n=>marketSport==='all'||playerSportV83(n)===marketSport);
 const cats=[['🔥','Heating Up'],['📈','Breaking Out'],['⚡','Storm Alert'],['💎','Sleeper Hunt'],['❄','Cooling Off']];
 const counts=SPORTS.map(s=>[s,COMPS.filter(c=>playerSportV83(c[0])===s).length]);
 const soldCounts={};filtered.forEach(c=>{soldCounts[c[0]]=(soldCounts[c[0]]||0)+1});

// checklistLibraryStatus: honest Product Intelligence / checklist-library
// badge text, driven by CHECKLIST_MANIFEST's own status field wherever a
// manifest entry exists for this exact sport+year+product name - never a
// separate, independently-maintained "looks complete" label. Returns null
// when no manifest entry covers this product, so the caller can fall back
// to its existing generic (non-verified) messaging instead of implying a
// verification status CardStorm has not actually recorded.
function checklistLibraryStatus(sportKey,yr,productName){
 const entry=(CHECKLIST_MANIFEST[sportKey+'|'+yr]||[]).find(p=>p.name===productName);
 if(!entry)return null;
 if(entry.status==='RELEASED')return 'FULL CHECKLIST LOADED • VERIFIED';
 if(entry.status==='PARTIAL')return 'PARTIAL CHECKLIST LOADED • VERIFIED SUBSET';
 return 'STRUCTURE LOADED • CARD IMPORT EXPANDING';
}
const _checklistCache={};
function loadChecklistProduct(sportKey,yr,prodKey){
 const k=sportKey+'|'+yr+'|'+prodKey,entry=(CHECKLIST_MANIFEST[sportKey+'|'+yr]||[]).find(p=>p.key===prodKey);
 if(!entry)return Promise.resolve(null);
 if(!_checklistCache[k])_checklistCache[k]=fetch(entry.file).then(r=>r.json()).catch(()=>null);
 return _checklistCache[k];
}

  return `<div class=homeSectionLabel>${sport.toUpperCase()} (${bySport[sport].length})</div><div class=watchgrid>${cards}</div>`;
 }).join('');

// AND card-image identification/grading both go through the same
// serverless endpoint - see /api/cardstorm.js).
//
// ENDPOINT STRATEGY - set this ONCE, not on every deploy:
// A Vercel project's production alias (either its default
// "https://<project-name>.vercel.app" domain, or a custom domain you attach
// to it) points at whatever was most recently deployed to production and
// does NOT change between deployments - only per-commit PREVIEW URLs change,
// and this must never be pointed at one of those. So there is no "URL
// changes every deploy" problem to solve here: deploy the api/ function to
// Vercel once, note its stable production URL (or better, attach a stable
// custom subdomain such as api.cardstormguide.com / api.stormguide.com to
// the Vercel project in its dashboard - see the PR description for the
// one-time DNS step), then set CARDSTORM_API_ENDPOINT below to that single
// URL and it never needs to change again. Until it's set, every call below
// returns an honest "not connected" result instead of ever inventing an
// answer, identity, or comp. No API key ever belongs here - the backend
// holds its own credentials server-side, this is just a public URL.
//
// Wired to the stable Vercel production alias (not a per-commit PREVIEW
// URL) - this project's own production domain, confirmed live in the PR
// discussion. Only a public endpoint URL, no secret.
const CARDSTORM_API_ENDPOINT='https://cardstorm-api.vercel.app/api/cardstorm';
async function cardstormBackendCall(body){

  return {connected:false};

 const res=await fetch(CARDSTORM_API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!res.ok){
  let msg='CardStorm\'s answer engine hit a snag.';
  try{const err=await res.json();if(err&&err.error)msg=err.error}catch(e){}
  throw new Error(msg);

}

// preserves enough detail to read card text/serial numbers.
const ACK_MAX_IMAGE_DIM=1600;
const ACK_JPEG_QUALITY=0.85;
function ackResizeImage(dataUrl){
 return new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
   let{width:w,height:h}=img;
   if(w<=ACK_MAX_IMAGE_DIM&&h<=ACK_MAX_IMAGE_DIM){resolve(dataUrl);return}
   const scale=ACK_MAX_IMAGE_DIM/Math.max(w,h);
   w=Math.round(w*scale);h=Math.round(h*scale);
   const canvas=document.createElement('canvas');
   canvas.width=w;canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);

 if(c.serialNumberedTo===1||tags.includes('1/1'))bits.push('A true one-of-one');

 else if(tags.includes('Auto'))bits.push('Includes an on-card autograph');
 if(tags.includes('Grail')&&!bits.length)bits.push('Widely regarded as a grail-tier chase');

// 2024 Panini Prizm Football - full 30,106-row verified checklist (Checklist Insider, cross-checked
// against Beckett). Wider scope than other product guides (Base+Parallels only) by explicit request;
// rendered through a dedicated category-tab UI (not the generic checklistGroups pipeline) because the
// dataset is far larger than that pipeline was built for - per-group card lists render lazily on first
// expand so opening a 25,494-row category doesn't build 25k DOM nodes up front.
let PRIZM_FULL=null;
let prizmFullReady=null;
let prizmActiveCategory='Base Cards';
function loadPrizmFull(){
 if(prizmFullReady)return prizmFullReady;
 prizmFullReady=fetch('data/football/2024/prizm.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{PRIZM_FULL=data;return data}).catch(e=>{console.error('CardStorm: failed to load 2024 Prizm Football checklist',e);PRIZM_FULL='error';return null});
 return prizmFullReady;
}
function prizmCardKey(cat,groupName,card){return 'prizm24|'+cat+'|'+groupName+'|'+card.cardNumber+'|'+card.athlete}
function prizmToggleOwned(cat,groupName,idx,checked){
 const o=loadOwned(),group=PRIZM_FULL.categories[cat].find(g=>g.name===groupName),card=group.cards[idx],k=prizmCardKey(cat,groupName,card);
 if(checked)o[k]=true;else delete o[k];
 saveOwned(o);
 renderPrizmTotals();
}
function prizmToggleGroup(cat,groupIdx){
 const id='pfg-'+cat.replace(/[^a-z0-9]/gi,'')+'-'+groupIdx,el=document.getElementById(id);
 if(!el)return;
 el.classList.toggle('open');
 if(el.classList.contains('open')&&!el.dataset.rendered){
  const group=PRIZM_FULL.categories[cat][groupIdx],owned=loadOwned();
  el.innerHTML=group.cards.map((c,i)=>{
   const k=prizmCardKey(cat,group.name,c),isOwned=!!owned[k];
   return `<label class="miniCheck ${isOwned?'owned':''}"><input type=checkbox ${isOwned?'checked':''} onchange="prizmToggleOwned('${cat.replace(/'/g,"\'")}','${group.name.replace(/'/g,"\'")}',${i},this.checked)"><div><b>${c.athlete}</b><div class=target>#${c.cardNumber} • ${c.team}${c.serialNumberedTo?' • /'+c.serialNumberedTo:''}</div><span class=pendingval>VALUE PENDING</span></div></label>`;
  }).join('');
  el.dataset.rendered='1';
 }
}
function renderPrizmCategory(cat){
 prizmActiveCategory=cat;
 const groups=PRIZM_FULL.categories[cat],host=document.getElementById('prizmGroups');
 if(!host)return;
 host.innerHTML=groups.map((g,idx)=>{
  const id='pfg-'+cat.replace(/[^a-z0-9]/gi,'')+'-'+idx;
  return `<section class=checkGroup><button class=groupHead onclick="prizmToggleGroup('${cat.replace(/'/g,"\'")}',${idx})"><span>${g.name}${g.serialNumberedTo?' /'+g.serialNumberedTo:''}</span><b>${g.count.toLocaleString()} cards</b><span>⌄</span></button><div class=groupBody id="${id}"></div></section>`;
 }).join('');
 document.querySelectorAll('.prizmTab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
 renderPrizmTotals();
}
function renderPrizmTotals(){
 const o=loadOwned();let ct=0,pending=0;
 Object.entries(PRIZM_FULL.categories).forEach(([cat,groups])=>groups.forEach(g=>g.cards.forEach(c=>{
  const k=prizmCardKey(cat,g.name,c);
  if(o[k]){ct++;if(c.rawValue==null&&c.psa9Value==null&&c.psa10Value==null)pending++}
 })));
 const total=document.getElementById('prizmTotalOwned'),pend=document.getElementById('prizmPendingCount');
 if(total)total.textContent=ct.toLocaleString();
 if(pend)pend.textContent=pending.toLocaleString();
}
const openSetChecklistPrizm24=openSetChecklist;
openSetChecklist=function(name){
 if(sport==='football'&&year==='2024'&&name==='Prizm'){
  if(!PRIZM_FULL){
   C.innerHTML=shell('SET CHECKLIST','2024 Prizm','FOOTBALL • Loading full verified checklist (30,106 rows)…','<div class=gameinstructions>Loading the full 2024 Prizm Football checklist…</div>');
   loadPrizmFull().then(()=>_openSetChecklistEntry(name));
   return;
  }
  if(PRIZM_FULL==='error'){
   C.innerHTML=shell('SET CHECKLIST','2024 Prizm','FOOTBALL',`<div class=notice>Could not load the checklist data file (data/football/2024/prizm.json). Try refreshing the page.</div><button class=cta onclick="goBack()">← BACK</button>`);
   return;
  }
  const p=PRIZM_FULL.product,s=PRIZM_FULL.summary,cats=Object.keys(PRIZM_FULL.categories);
  C.innerHTML=shell('SET CHECKLIST','2024 Prizm','FOOTBALL • Complete collector checklist by category',`<div class=collectiontop><div class=feature><h2>Prizm Collector Checklist</h2><p class=sub>${p.displayName} • released ${p.releaseDate} • ${s.sourceRows.toLocaleString()} verified checklist rows across ${cats.length} categories. Source: <a class=verify href="${p.source.url}" target=_blank>${p.source.name}</a>, cross-checked against Beckett.</p><div class=sourceTag>${p.source.note}</div></div><div class=collectionvalue><div class=k>THIS SET — COLLECTION VALUE</div><div class=total id=prizmTotalOwned>0</div><div class=valuationnote>cards owned</div><div class=metricrow><div class=metric>Value pending<b id=prizmPendingCount>0</b></div><div class=metric>Total checklist rows<b>${s.sourceRows.toLocaleString()}</b></div></div><div class=valuationnote>Values are intentionally Pending until a verified comp feed is connected. CardStorm never invents prices.</div></div></div><div class=v83tabs>${cats.map(c=>`<button class="prizmTab ${c===prizmActiveCategory?'active':''}" data-cat="${c}" onclick="renderPrizmCategory('${c.replace(/'/g,"\'")}')">${c} (${s.categoryCounts[c].toLocaleString()})</button>`).join('')}</div><div class=groupList id=prizmGroups></div>`);
  renderPrizmCategory(prizmActiveCategory);
  return;
 }
 openSetChecklistPrizm24(name);
}

// 2024 Panini Select Football - separate product, separate data file, separate functions from Prizm
// above per explicit instruction (do not merge/substitute). 520 real base+XRC cards (Concourse/Premier/
// Club/Suite/Field/XRC); Parallels/Inserts/Autographs/Memorabilia are verified family/type names only
// (no per-card enumeration claimed for those - matches what the source data actually provides).
let SELECT_FULL=null;
let selectFullReady=null;
let selectActiveCategory='Concourse';
function loadSelectFull(){
 if(selectFullReady)return selectFullReady;
 selectFullReady=fetch('data/football/2024/select.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{SELECT_FULL=data;return data}).catch(e=>{console.error('CardStorm: failed to load 2024 Select Football checklist',e);SELECT_FULL='error';return null});
 return selectFullReady;
}
function selectCardKey(cat,card){return 'select24|'+cat+'|'+card.cardNumber+'|'+card.player}
function selectFamilyKey(cat,level,name){return 'select24fam|'+cat+'|'+(level||'')+'|'+name}
function selectToggleOwned(cat,idx,checked){
 const o=loadOwned(),card=SELECT_FULL.categories[cat].cards[idx],k=selectCardKey(cat,card);
 if(checked)o[k]=true;else delete o[k];
 saveOwned(o);
 renderSelectTotals();
}
function selectToggleFamily(cat,level,name,checked){
 const o=loadOwned(),k=selectFamilyKey(cat,level,name);
 if(checked)o[k]=true;else delete o[k];
 saveOwned(o);
 renderSelectTotals();
}
function renderSelectCategory(cat){
 selectActiveCategory=cat;
 const info=SELECT_FULL.categories[cat],host=document.getElementById('selectGroups'),owned=loadOwned();
 if(!host)return;
 if(info.kind==='cards'){
  host.innerHTML=`<section class="checkGroup open"><div class="groupBody open">${info.cards.map((c,i)=>{
   const k=selectCardKey(cat,c),isOwned=!!owned[k];
   return `<label class="miniCheck ${isOwned?'owned':''}"><input type=checkbox ${isOwned?'checked':''} onchange="selectToggleOwned('${cat}',${i},this.checked)"><div><b>${c.player}</b><div class=target>#${c.cardNumber} • ${c.level}${c.rookie?' • RC':''}${c.xrc?' • XRC':''}${c.exchange?' • Exchange':''}</div><span class=pendingval>VALUE PENDING</span></div></label>`;
  }).join('')}</div></section>`;
 } else if(cat==='Parallels'){
  host.innerHTML=Object.entries(info.byLevel).map(([level,names])=>`<section class=checkGroup><button class=groupHead onclick="toggleChecklistGroup(this.nextElementSibling.id)"><span>${level}</span><b>${names.length} parallels</b><span>⌄</span></button><div class=groupBody id="selpar-${level.replace(/[^a-z0-9]/gi,'')}">${names.map(name=>{const k=selectFamilyKey('Parallels',level,name),isOwned=!!owned[k];return `<label class="miniCheck ${isOwned?'owned':''}"><input type=checkbox ${isOwned?'checked':''} onchange="selectToggleFamily('Parallels','${level.replace(/'/g,"\'")}','${name.replace(/'/g,"\'")}',this.checked)"><div><b>${name}</b><div class=target>${level} parallel</div><span class=pendingval>VALUE PENDING</span></div></label>`;}).join('')}</div></section>`).join('');
 } else {
  host.innerHTML=`<section class="checkGroup open"><div class="groupBody open">${info.families.map(name=>{const k=selectFamilyKey(cat,null,name),isOwned=!!owned[k];return `<label class="miniCheck ${isOwned?'owned':''}"><input type=checkbox ${isOwned?'checked':''} onchange="selectToggleFamily('${cat}',null,'${name.replace(/'/g,"\'")}',this.checked)"><div><b>${name}</b><div class=target>${cat} family</div><span class=pendingval>VALUE PENDING</span></div></label>`;}).join('')}</div></section>`;
 }
 document.querySelectorAll('.selectTab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
 renderSelectTotals();
}
function renderSelectTotals(){
 const o=loadOwned();let ct=0;
 Object.entries(SELECT_FULL.categories).forEach(([cat,info])=>{
  if(info.kind==='cards')info.cards.forEach(c=>{if(o[selectCardKey(cat,c)])ct++});
  else if(cat==='Parallels')Object.entries(info.byLevel).forEach(([level,names])=>names.forEach(name=>{if(o[selectFamilyKey('Parallels',level,name)])ct++}));
  else info.families.forEach(name=>{if(o[selectFamilyKey(cat,null,name)])ct++});
 });
 const total=document.getElementById('selectTotalOwned');
 if(total)total.textContent=ct.toLocaleString();
}

 if(sport==='football'&&year==='2024'&&name==='Select'){

// 2024 Panini Donruss Football - separate product, separate data file, separate functions from
// Prizm/Select above per explicit instruction (do not merge/substitute). Full verified checklists for
// Rated Rookies #301-400, Downtown!, and Downtown! Horizontal, plus the verified parallel/numbered/1-of-1
// hierarchy. Veteran base #1-300 and most insert/autograph/memorabilia player lists are honestly marked
// pending (not fabricated) per the source package's coverage notes.
let DONRUSS_FULL=null;
let donrussFullReady=null;
let donrussActiveCategory='Rated Rookies';
function loadDonrussFull(){
 if(donrussFullReady)return donrussFullReady;
 donrussFullReady=fetch('data/football/2024/donruss.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{DONRUSS_FULL=data;return data}).catch(e=>{console.error('CardStorm: failed to load 2024 Donruss Football checklist',e);DONRUSS_FULL='error';return null});

function donrussFamilyKey(cat,name){return 'donruss24fam|'+cat+'|'+name}
function donrussSubKey(cat,group,card){return 'donruss24sub|'+cat+'|'+group+'|'+card.cardNumber+'|'+(card.player||card.players||'')}
function donrussFamilyName(f){return typeof f==='string'?f:f.name}
function donrussCategoryCount(info){
 if(info.kind==='cards')return info.cards.length;
 if(info.kind==='families')return info.families.length;
 if(info.kind==='subgroups')return Object.values(info.groups).reduce((a,g)=>a+g.length,0);

function donrussToggleOwned(cat,idx,checked){

 saveOwned(o);

function donrussToggleFamily(cat,name,checked){
 const o=loadOwned(),k=donrussFamilyKey(cat,name);
 if(checked)o[k]=true;else delete o[k];
 saveOwned(o);
 renderDonrussTotals();
}
function donrussToggleSub(cat,group,idx,checked){
 const o=loadOwned(),card=DONRUSS_FULL.categories[cat].groups[group][idx],k=donrussSubKey(cat,group,card);

   const name=donrussFamilyName(f),k=donrussFamilyKey(cat,name),isOwned=!!owned[k];
   const extra=(typeof f==='object'&&f.serialNumberedTo)?(' • '+f.serialNumberedTo):'';

 document.querySelectorAll('.donrussTab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));

function renderDonrussTotals(){

 Object.entries(DONRUSS_FULL.categories).forEach(([cat,info])=>{
  if(info.kind==='cards')info.cards.forEach(c=>{if(o[donrussCardKey(cat,c)])ct++});
  else if(info.kind==='families')info.families.forEach(f=>{if(o[donrussFamilyKey(cat,donrussFamilyName(f))])ct++});
  else if(info.kind==='subgroups')Object.entries(info.groups).forEach(([group,cards])=>cards.forEach(c=>{if(o[donrussSubKey(cat,group,c)])ct++}));
 });
 const total=document.getElementById('donrussTotalOwned');
 if(total)total.textContent=ct.toLocaleString();
}
