name: TEMPORARY - PR 28 preview + live Ask CardStorm smoke test

# TEMPORARY DIAGNOSTIC WORKFLOW - not part of the permanent CI/CD setup.
# Same proven pattern as .github/workflows/card-image-poc-live-test.yml
# (see that file for the original precedent) but scoped to this PR's own
# concerns: PR 28 (launch readiness sweep), branch claude/launch-readiness-sweep.
#
# What this does, from a GitHub-hosted runner (which has real outbound
# network access, unlike this sandbox's dev environment - confirmed via a
# direct curl to both target hosts returning "CONNECT tunnel failed,
# response 403" from inside the sandbox, not assumed):
#
#   1. Requests the cardstorm frontend's Vercel PREVIEW deployment for this
#      branch and reports whether it's reachable (200) or gated behind
#      Vercel Deployment Protection (401/403) - reported honestly either way,
#      no attempt is made to bypass protection without a real exception/token.
#   2. POSTs three real user questions to the LIVE PRODUCTION Ask CardStorm
#      backend at https://cardstorm-api.vercel.app/api/cardstorm (contract
#      confirmed by reading api/cardstorm.js, api/lib/cors.js and
#      api/lib/validate.js - NOT guessed), using the Origin header of an
#      already-allow-listed production origin (api/lib/cors.js) so the
#      request isn't itself rejected by CORS. No Anthropic API key is
#      touched, stored, or logged anywhere in this workflow - the key lives
#      only in Vercel's own environment variables for the cardstorm-api
#      project, server-side.
#
# DELETE THIS FILE once live validation is reviewed and no longer needed -
# none of this is meant to ship to main.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/launch-readiness-sweep"
    paths:
      - ".github/workflows/pr28-preview-smoke-test.yml"
      - "scripts/live-test-pr28-preview.js"

jobs:
  live-test:
    runs-on: ubuntu-latest
    env:
      FRONTEND_PREVIEW_URL: "https://cardstorm-git-claude-launch-readiness-sweep-card-storm.vercel.app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend-preview reachability check + live Ask CardStorm smoke test
        run: node scripts/live-test-pr28-preview.js
