name: TEMPORARY - CardStorm E2E browser test

# TEMPORARY DIAGNOSTIC WORKFLOW - not part of the permanent CI/CD setup.
# Drives the REAL Ask CardStorm UI in a real headless browser against the
# REAL, LIVE PRODUCTION backend, because this sandbox's own dev environment
# has no outbound network access to any *.vercel.app domain and so cannot
# run this itself. GitHub-hosted runners have normal internet access.
#
# Serves the site UNMODIFIED (app.html already points at the real
# production endpoint - no URL swap). The only wrinkle: production's CORS
# allow-list (api/lib/cors.js) only accepts https://cardstormguide.com /
# stormguide.com (+www. variants) and correctly rejects a bare CI-runner
# origin like localhost. Rather than relax production CORS (never do that)
# or fall back to a Preview deployment (which may not even exist once a
# branch's latest deployment has been promoted straight to Production),
# this maps cardstormguide.com to 127.0.0.1 in /etc/hosts and serves this
# copy of the site over HTTPS on the default port 443 with a throwaway
# self-signed cert, so the runner's own Chromium instance sends a real,
# exactly-matching `Origin: https://cardstormguide.com` header - the
# production CORS check passes honestly, not bypassed.
#
# A second job independently confirms the real PRODUCTION endpoint itself
# is live and correctly CORS-configured via plain curl, both for an
# approved Origin and a rejected one.
#
# DELETE THIS FILE (and cardstorm-preview-api-test.yml, and
# scripts/e2e-live-backend-test.js) once end-to-end testing is reviewed and
# no longer needed - none of this is meant to ship to main.
on:
  push:
    branches:
      - "claude/cardstorm-homepage-audit-3s3222"
    paths:
      - ".github/workflows/cardstorm-e2e-browser-test.yml"
      - "scripts/e2e-live-backend-test.js"
      - "app.html"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Generate an intentionally unclear/blurry test image
        run: |
          mkdir -p scripts/fixtures
          # ImageMagick and Pillow both turned out to be absent on this
          # runner image (verified, not assumed, after a real CI failure) -
          # sharp is a pure-Node lib with prebuilt binaries, installed
          # above alongside Playwright, so this has no system-tool
          # dependency. Down/up-samples a REAL card photo already in the
          # repo with heavy blur - a genuinely degraded version of a real
          # image, not a fabricated one.
          node -e "
            const sharp = require('sharp');
            sharp('assets/reference-cards/2024-donruss-bo-nix.webp')
              .resize(12, 12)
              .resize(500, 500)
              .blur(8)
              .jpeg({ quality: 60 })
              .toFile('scripts/fixtures/unclear-test-image.jpg')
              .then(() => console.log('unclear-test-image.jpg generated'))
              .catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Prepare an unmodified copy of the site (app.html already points at production)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude node_modules --exclude .git ./ /tmp/site/
          grep -o "CARDSTORM_API_ENDPOINT='[^']*'" /tmp/site/app.html
      - name: Make this runner's browser a real, approved CORS origin (cardstormguide.com)
        run: |
          echo "127.0.0.1 cardstormguide.com" | sudo tee -a /etc/hosts
          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/tls/key.pem -out /tmp/tls/cert.pem \
            -subj "/CN=cardstormguide.com"
      - name: Serve the test copy over HTTPS on the default port (443) as cardstormguide.com
        run: |
          sudo npx --yes http-server /tmp/site -p 443 -S -C /tmp/tls/cert.pem -K /tmp/tls/key.pem -s &
          sleep 2
          curl -sIk https://cardstormguide.com/index.html | head -1
      - name: Run the real-browser E2E test against the live PRODUCTION backend
        env:
          SITE_URL: "https://cardstormguide.com"
        run: node scripts/e2e-live-backend-test.js

  verify-production-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the stable production endpoint is live and CORS-correct
        run: |
          set -uo pipefail
          URL="https://cardstorm-api.vercel.app/api/cardstorm"
          echo "::group::Production endpoint - approved origin (cardstormguide.com)"
          curl -sS -i -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Origin: https://cardstormguide.com" \
            -d '{"question":"What makes Downtown inserts so valuable?","conversation":[],"images":{}}' \
            -w $'\n---HTTP_STATUS:%{http_code}---TIME_TOTAL:%{time_total}---'
          echo
          echo "::endgroup::"
          echo "::group::Production endpoint - unapproved origin"
          curl -sS -i -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Origin: https://evil.example.com" \
            -d '{"question":"CORS check","conversation":[],"images":{}}'
          echo
          echo "::endgroup::"
