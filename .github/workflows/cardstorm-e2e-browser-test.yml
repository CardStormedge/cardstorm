name: TEMPORARY - CardStorm E2E browser test

# TEMPORARY DIAGNOSTIC WORKFLOW - not part of the permanent CI/CD setup.
# Drives the REAL Ask CardStorm UI in a real headless browser against a
# LIVE backend deployment, because this sandbox's own dev environment has
# no outbound network access to any *.vercel.app domain and so cannot run
# this itself. GitHub-hosted runners have normal internet access.
#
# Serves a COPY of the site with only CARDSTORM_API_ENDPOINT swapped from
# the shipped production URL to this PR's own preview deployment URL - not
# a shortcut, a necessity: the production endpoint's CORS allow-list
# intentionally rejects a CI runner's localhost origin once
# VERCEL_ENV==="production" (see api/lib/cors.js), while a preview
# deployment relaxes that specifically for pre-merge testing like this.
#
# A second job independently confirms the real PRODUCTION endpoint itself
# is live and correctly CORS-configured, using an actually-approved Origin
# header (https://cardstormguide.com) rather than a browser.
#
# DELETE THIS FILE (and cardstorm-preview-api-test.yml, and
# scripts/e2e-live-backend-test.js) once end-to-end testing is reviewed and
# no longer needed - none of this is meant to ship to main.
on:
  push:
    branches:
      - "claude/cardstorm-homepage-audit-3s3222"
    paths:
      - ".github/workflows/cardstorm-e2e-browser-test.yml"
      - "scripts/e2e-live-backend-test.js"
      - "app.html"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: "https://cardstorm-api-git-claude-cardstorm-homepage-a-c0fda6-card-storm.vercel.app/api/cardstorm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Generate an intentionally unclear/blurry test image
        run: |
          mkdir -p scripts/fixtures
          # ImageMagick and Pillow both turned out to be absent on this
          # runner image (verified, not assumed, after a real CI failure) -
          # sharp is a pure-Node lib with prebuilt binaries, installed
          # above alongside Playwright, so this has no system-tool
          # dependency. Down/up-samples a REAL card photo already in the
          # repo with heavy blur - a genuinely degraded version of a real
          # image, not a fabricated one.
          node -e "
            const sharp = require('sharp');
            sharp('assets/reference-cards/2024-donruss-bo-nix.webp')
              .resize(12, 12)
              .resize(500, 500)
              .blur(8)
              .jpeg({ quality: 60 })
              .toFile('scripts/fixtures/unclear-test-image.jpg')
              .then(() => console.log('unclear-test-image.jpg generated'))
              .catch((e) => { console.error(e); process.exit(1); });
          "
      - name: Prepare a test copy of the site with the endpoint pointed at THIS PR's preview
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude node_modules --exclude .git ./ /tmp/site/
          sed -i "s#https://cardstorm-api.vercel.app/api/cardstorm#${PREVIEW_URL}#" /tmp/site/app.html
          grep -o "CARDSTORM_API_ENDPOINT='[^']*'" /tmp/site/app.html
      - name: Serve the test copy
        run: |
          npx --yes http-server /tmp/site -p 8080 -s &
          sleep 2
          curl -sI http://localhost:8080/index.html | head -1
      - name: Run the real-browser E2E test against the live preview backend
        env:
          SITE_URL: "http://localhost:8080"
        run: node scripts/e2e-live-backend-test.js

  verify-production-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the stable production endpoint is live and CORS-correct
        run: |
          set -uo pipefail
          URL="https://cardstorm-api.vercel.app/api/cardstorm"
          echo "::group::Production endpoint - approved origin (cardstormguide.com)"
          curl -sS -i -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Origin: https://cardstormguide.com" \
            -d '{"question":"What makes Downtown inserts so valuable?","conversation":[],"images":{}}' \
            -w $'\n---HTTP_STATUS:%{http_code}---TIME_TOTAL:%{time_total}---'
          echo
          echo "::endgroup::"
          echo "::group::Production endpoint - unapproved origin"
          curl -sS -i -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "Origin: https://evil.example.com" \
            -d '{"question":"CORS check","conversation":[],"images":{}}'
          echo
          echo "::endgroup::"
