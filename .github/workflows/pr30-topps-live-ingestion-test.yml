name: TEMPORARY - PR30 live Topps checklist ingestion test

# TEMPORARY DIAGNOSTIC WORKFLOW - not part of the permanent CI/CD setup, and
# NOT intended to be merged to main. Exists only so a GitHub-hosted runner
# (which has real outbound network access) can prove or disprove
# scripts/checklists/ingest-topps.js against real topps.com pages, because
# this session's own sandbox cannot reach topps.com at all (confirmed via
# both curl and WebFetch: "CONNECT tunnel failed, response 403" /
# EGRESS_BLOCKED - see the PR #30 description and README for the exact
# evidence from the prior round).
#
# This workflow:
#   1. Discovers real, current official Topps checklist URLs by fetching
#      topps.com's own checklist/navigation pages and reading their actual
#      links (scripts/checklists/live-test-topps.js) - it never guesses a
#      URL pattern from outside the sandbox.
#   2. Fetches each real source, detects its real format, and only for an
#      HTML table runs the real production parser
#      (parseToppsChecklistHtml -> normalizeChecklist -> validateChecklist).
#   3. Uploads the raw fetched bodies + normalized JSON as a workflow
#      artifact for inspection. Nothing fetched here is committed to the
#      repo - see the PR's explicit instruction not to commit manufacturer
#      files.
#
# workflow_dispatch is included for completeness/future manual re-runs, but
# per GitHub platform behavior a workflow_dispatch trigger cannot actually
# be invoked via the Actions API until the workflow file exists on the
# repo's default branch (confirmed in earlier PR rounds via a 404 from the
# dispatch API) - so this also triggers on push, scoped ONLY to this exact
# PR branch name, matching the same pattern used for prior temporary
# live-validation workflows in this repo's history (see
# card-image-poc-live-test.yml from PR #27, and the PR #28 preview
# smoke-test workflow).
#
# Per the user's explicit instruction this round, this file is left in
# place on the branch (not deleted) for reviewer visibility - it remains
# unmerged as long as PR #30 itself is unmerged.
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/checklist-recovery-ingestion"
    paths:
      - ".github/workflows/pr30-topps-live-ingestion-test.yml"
      - "scripts/checklists/live-test-topps.js"
      - "scripts/checklists/live-pdf-probe.js"
      - "scripts/checklists/live-pdf-probe-bb-fb.js"
      - "scripts/checklists/live-pdf-persist-bbfb.js"
      - "scripts/checklists/discover-bbfb-products.js"
      - "scripts/checklists/probe-additional-bbfb.js"
      - "scripts/checklists/live-pdf-ingestion.js"
      - "scripts/checklists/ingest-basketball-pdf.js"
      - "scripts/checklists/ingest-football-pdf.js"
      - "scripts/checklists/team-names-by-sport.js"
      - "scripts/checklists/fetch-source.js"
      - "scripts/checklists/ingest-topps.js"
      - "scripts/checklists/ingest-topps-pdf.js"
      - "scripts/checklists/normalize-checklist.js"
      - "scripts/checklists/validate-checklist.js"
      - "scripts/checklists/schema.js"
      - "package.json"

permissions:
  contents: read

jobs:
  live-topps-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (incl. pdf-parse, for real PDF checklist extraction)
        run: npm install --no-save

      - name: Confirm real network reachability to topps.com (no mocking)
        run: |
          echo "--- default curl UA, /checklists ---"
          curl -s -o /dev/null -w "%{http_code}\n" https://www.topps.com/checklists || true
          echo "--- default curl UA, / ---"
          curl -s -o /dev/null -w "%{http_code}\n" https://www.topps.com/ || true
          echo "--- browser-like UA, / ---"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" https://www.topps.com/ || true
          echo "--- browser-like UA, /checklists ---"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" https://www.topps.com/checklists || true
          echo "--- browser-like UA, robots.txt ---"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" https://www.topps.com/robots.txt || true
          echo "--- browser-like UA, sitemap.xml ---"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" https://www.topps.com/sitemap.xml || true
          echo "--- verbose headers, browser UA, / (first 40 lines) ---"
          curl -sD - -o /dev/null -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" https://www.topps.com/ | head -40 || true

      - name: Run live Topps discovery + ingestion test
        run: node scripts/checklists/live-test-topps.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Confirm real network reachability to cdn.shopify.com (Topps's own checklist-PDF CDN - a different host than www.topps.com)
        run: |
          echo "--- HEAD, 2024 Topps Series 1 Baseball checklist PDF ---"
          curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" "https://cdn.shopify.com/s/files/1/0662/9749/5709/files/MLB2401-2024ToppsSeries1BBChecklistV1.pdf" | head -20 || true
          echo "--- HEAD, 2026 Topps Series 1 Baseball checklist PDF ---"
          curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" "https://cdn.shopify.com/s/files/1/0662/9749/5709/files/2026_Topps_Series_1_Baseball_Checklist_2-23.pdf?v=1772557808" | head -20 || true

      # The 3 steps below (full baseball probe, full 34-source ingestion,
      # basketball/football raw-text probe) are kept in the file for the
      # record - they already did their job in earlier runs (see the PR #30
      # comments) - but are disabled (`if: false`) for this run specifically
      # so the job log stays small enough to reliably fetch: combined, their
      # raw-text dumps make one run's log large enough that log retrieval
      # became unreliable. The focused step below re-fetches only the 2
      # basketball/football products actually being validated this round,
      # with no raw-text dump, keeping this run's log small.
      - name: Probe real PDF text structure (baseball Series 1, 2024/2025/2026) - phase 1, discovery only
        if: false
        run: node scripts/checklists/live-pdf-probe.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Run full live PDF ingestion (all real CDN sources, parser + validate)
        if: false
        run: node scripts/checklists/live-pdf-ingestion.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Probe real PDF text structure (one basketball + one football source) - never assume baseball's rules transfer
        if: false
        run: node scripts/checklists/live-pdf-probe-bb-fb.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Persist-check the 2 basketball/football products the real-structure fix targets (lean, no raw-text dump)
        if: false
        run: node scripts/checklists/live-pdf-persist-bbfb.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Discover + probe additional real basketball/football checklist PDFs (never guesses a URL - real links only, from topps.com's own real pages)
        if: false
        run: node scripts/checklists/discover-bbfb-products.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Probe additional real basketball/football checklist PDFs found via real external index of the same cdn.shopify.com store (topps.com itself now 403s every path, even "/", confirmed above - see script header)
        if: hashFiles('scripts/checklists/probe-additional-bbfb.js') != ''
        run: node scripts/checklists/probe-additional-bbfb.js "$GITHUB_WORKSPACE/live-test-output"

      - name: Upload live test output (raw fetches + normalized JSON, NOT committed to the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr30-live-topps-test-output
          path: live-test-output/
          retention-days: 14
