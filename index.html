<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="description" content="CardStorm collector intelligence">
<title>CardStorm Edge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}
#core{display:block;width:100%;height:100%;border:0;background:#020914}
</style>
</head>
<body>
<iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe>
<script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const core=document.getElementById('core');
const HOME_THEMES=[
 {title:'ROOKIES',kicker:'THE FUTURE BREAKS HERE',sub:'Rookie heat, first-year cards and the next generation of hobby stars.'},
 {title:'GOATs',kicker:'LEGENDS NEVER FADE',sub:'The all-time names and cards that define the ceiling of the hobby.'},
 {title:'HOLY GRAILS',kicker:'THE RAREST OF THE RARE',sub:'Collection-defining cards, impossible chases and true centerpieces.'},
 {title:'CASE HITS',kicker:'BIGGER PULLS. BIGGER MOMENTS.',sub:'SSPs, case hits and the pulls that stop a break cold.'},
 {title:'DOWNTOWN / UPTOWN',kicker:'ART MEETS THE HOBBY',sub:'The iconic art inserts collectors recognize instantly.'},
 {title:'BREAK & PLAY',kicker:'GAME • BREAKS • COMMUNITY',sub:'CardStorm games and social-break energy in one collector lane.'},
 {title:'POKÉMON',kicker:'CATCH THE STORM',sub:'Pokémon sets, chase cards and TCG collector heat.'}
];
function stripe(){top.location.href=STRIPE}
function ensureStyles(doc){if(doc.getElementById('csCollectorFix'))return;const st=doc.createElement('style');st.id='csCollectorFix';st.textContent=`
.hero .slide .heroimg{display:none!important}
.hero .slide{background-color:#04101b!important;background-size:cover!important;background-position:center!important}
.hero .slide:nth-of-type(1){background:radial-gradient(circle at 77% 38%,rgba(55,160,255,.36),transparent 23%),linear-gradient(132deg,#020914 0%,#071b31 50%,#0b3b64 100%)!important}
.hero .slide:nth-of-type(2){background:radial-gradient(circle at 77% 40%,rgba(196,203,217,.24),transparent 23%),linear-gradient(132deg,#03070c 0%,#111820 48%,#343b45 100%)!important}
.hero .slide:nth-of-type(3){background:radial-gradient(circle at 75% 42%,rgba(255,190,52,.34),transparent 20%),linear-gradient(132deg,#080703 0%,#281c05 48%,#664509 100%)!important}
.hero .slide:nth-of-type(4){background:radial-gradient(circle at 76% 38%,rgba(224,29,47,.34),transparent 22%),linear-gradient(132deg,#070307 0%,#2a0910 50%,#63131e 100%)!important}
.hero .slide:nth-of-type(5){background:radial-gradient(circle at 77% 40%,rgba(45,125,255,.32),transparent 22%),linear-gradient(132deg,#020914 0%,#081c36 42%,#16376b 72%,#0e5e89 100%)!important}
.hero .slide:nth-of-type(6){background:radial-gradient(circle at 78% 38%,rgba(143,84,255,.3),transparent 22%),linear-gradient(132deg,#030612 0%,#140b2d 48%,#3a175b 100%)!important}
.hero .slide:nth-of-type(7){background:radial-gradient(circle at 78% 38%,rgba(255,210,53,.24),transparent 22%),linear-gradient(132deg,#04101b 0%,#12233e 48%,#3e3508 100%)!important}
.hero .slide:after{content:attr(data-theme);position:absolute;right:clamp(24px,5vw,80px);top:50%;transform:translateY(-50%);z-index:1;font-size:clamp(46px,8vw,118px);font-weight:950;letter-spacing:-.055em;color:rgba(255,255,255,.09);text-align:right;max-width:52%;line-height:.86;text-transform:uppercase;pointer-events:none}
.hero .slide:nth-of-type(3):after,.hero .slide:nth-of-type(7):after{color:rgba(255,220,87,.13)}
.hero .slide:nth-of-type(4):after{color:rgba(255,84,96,.13)}
.starPlate{display:none!important}
#csThemeRail{position:absolute;z-index:8;left:clamp(20px,4vw,64px);right:clamp(20px,4vw,64px);bottom:18px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#csThemeRail::-webkit-scrollbar{display:none}.csThemeBtn{flex:0 0 auto;border:1px solid rgba(104,177,226,.3);background:rgba(2,9,20,.82);color:#b9cbd9;border-radius:7px;padding:9px 12px;font-size:10px;font-weight:900;letter-spacing:.08em;cursor:pointer}.csThemeBtn.active{color:#fff;border-color:#55d8ff;background:#0a2741;box-shadow:0 0 14px rgba(85,216,255,.22)}
.grid{gap:0!important;border-top:1px solid rgba(79,132,172,.22)!important;border-left:1px solid rgba(79,132,172,.22)!important}.grid .card{border:0!important;border-right:1px solid rgba(79,132,172,.22)!important;border-bottom:1px solid rgba(79,132,172,.22)!important;border-radius:0!important;background:linear-gradient(155deg,rgba(8,26,43,.86),rgba(3,12,22,.96))!important;box-shadow:none!important}.grid .card .icon{display:none!important}.grid .card h3{margin-top:42px!important}.grid .card:before{content:attr(data-cs-index);position:absolute;top:18px;left:18px;color:#55d8ff;font-size:10px;font-weight:900;letter-spacing:.18em}.grid .card:hover{transform:none!important;box-shadow:inset 0 3px 0 #55d8ff!important}.funStrip .feature{border-radius:0!important}.funStrip .feature.gold{background:linear-gradient(155deg,rgba(8,26,43,.86),rgba(3,12,22,.96))!important;border-color:#2d648c!important}
@media(max-width:760px){.hero .slide:after{font-size:54px;max-width:82%;right:18px;top:24%;}.heroCopy{padding-bottom:115px!important}.csThemeBtn{padding:8px 9px;font-size:9px}}
`;doc.head.appendChild(st)}
function patchHomepageThemes(win,doc){try{const hero=doc.querySelector('.hero'),slides=[...doc.querySelectorAll('.hero .slide')];if(!hero||!slides.length)return;ensureStyles(doc);slides.forEach((slide,i)=>{if(i<7){slide.style.display='block';slide.dataset.theme=HOME_THEMES[i].title}else{slide.style.display='none';slide.classList.remove('active')}});let rail=doc.getElementById('csThemeRail');if(!rail){rail=doc.createElement('div');rail.id='csThemeRail';hero.appendChild(rail)}const active=slides.slice(0,7);const show=i=>{i=((i%7)+7)%7;active.forEach((s,n)=>s.classList.toggle('active',n===i));const d=HOME_THEMES[i],k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));win.__csThemeIndex=i;hero.classList.remove('strike');void hero.offsetWidth;hero.classList.add('strike')};rail.innerHTML='';HOME_THEMES.forEach((d,i)=>{const b=doc.createElement('button');b.className='csThemeBtn';b.type='button';b.textContent=d.title;b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};rail.appendChild(b)});if(!win.__csCollectorThemeInstalled){win.__csCollectorThemeInstalled=true;clearInterval(win.__csHeroTimer);show(0);win.__csThemeTimer=setInterval(()=>show((win.__csThemeIndex||0)+1),6500)}}catch(e){console.error(e)}}
function patchCards(doc){try{ensureStyles(doc);doc.querySelectorAll('.grid .card').forEach((c,i)=>c.dataset.csIndex=String(i+1).padStart(2,'0'));doc.querySelectorAll('#view .top .nav button').forEach(b=>{if((b.textContent||'').trim().toUpperCase()==='TCG')b.style.display='none'})}catch(e){}}
function patchPage(win,doc){try{if(!win||!doc)return;patchHomepageThemes(win,doc);patchCards(doc);doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}});try{win.startTrial=stripe}catch(e){};doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csCollectorFix){fr.dataset.csCollectorFix='1';fr.addEventListener('load',()=>{try{patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){console.error('CardStorm patch failed',e)}}
function patchAll(){try{patchPage(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,300);setTimeout(patchAll,1200)});
</script>
</body>
</html>
