<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020914"><meta name="description" content="CardStorm gives collectors card-market intelligence, verified set data, chase guidance and collector tools."><title>CardStorm Edge</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}</style></head><body><iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe><script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const LOGO='assets/logo-approved.webp';
const TRAVIS='assets/herocardfootball.webp';
const ROOKIE='https://res.cloudinary.com/rfbvfxpo/image/upload/v1787776591/cardstorm/hero/rookie-nextup.webp';
const POKE='assets/pokemontcglogo.webp';
const core=document.getElementById('core');
function stripe(){top.location.href=STRIPE}
const THEMES=[
  {title:'ROOKIES',kicker:'CHASE THE NEXT ONE',sub:'Rookie heat, breakout cards and slabs with the biggest upside.',img:ROOKIE},
  {title:'GOATs',kicker:'LEGEND MODE',sub:'The cards that define the ceiling — icons, all-time names and hobby benchmarks.',img:TRAVIS},
  {title:'HOLY GRAILS',kicker:'THE CARDS PEOPLE DREAM ABOUT',sub:'Monster cards, impossible chases and true collection centerpieces.',img:TRAVIS},
  {title:'CASE HITS',kicker:'ONE BOX CAN CHANGE EVERYTHING',sub:'Ultra-short prints, case hits and the cards breakers stop the room for.',img:ROOKIE},
  {title:'DOWNTOWN / UPTOWN',kicker:'THE ART CHASE',sub:'The visual inserts collectors recognize instantly — big art, big demand, big moments.',img:TRAVIS},
  {title:'BREAK & PLAY',kicker:'GAME + SOCIAL BREAKS',sub:'Play the CardStorm challenge and jump straight into the social-break action from one place.',img:ROOKIE},
  {title:'POKÉMON TCG',kicker:'SEALED • CHASE • ICONS',sub:'Sets, sealed products and the cards that make Pokémon collecting explode.',img:POKE}
];
function installHero(win,doc){
  try{
    const all=[...doc.querySelectorAll('.hero .slide')];if(!all.length)return;
    const slides=all.slice(0,THEMES.length);all.slice(THEMES.length).forEach(s=>s.style.display='none');
    doc.querySelectorAll('.starPlate').forEach(x=>x.style.display='none');
    slides.forEach((slide,i)=>{const d=THEMES[i];slide.style.display='block';slide.dataset.theme=d.title;const img=slide.querySelector('.heroimg');if(img){img.className='heroimg csThemeHero';img.src=d.img;img.alt='CardStorm '+d.title+' chase theme';img.onerror=()=>{img.onerror=null;img.src=TRAVIS}};slide.querySelectorAll('.csTeamBadge,.csTeamMark').forEach(x=>x.remove());if(!slide.querySelector('.csBreakoutFX')){const fx=doc.createElement('div');fx.className='csBreakoutFX';slide.appendChild(fx)}});
    if(!doc.getElementById('csThemeStyle')){const st=doc.createElement('style');st.id='csThemeStyle';st.textContent=`
      .hero .slide{background:radial-gradient(circle at 76% 44%,rgba(68,172,255,.28),transparent 26%),linear-gradient(120deg,#020914 0%,#071827 45%,#0b2740 72%,#020914 100%)!important}.hero .slide .heroimg.csThemeHero{object-fit:cover!important;object-position:center!important;width:100%!important;height:100%!important;left:0!important;right:0!important;top:0!important;bottom:0!important;padding:0!important;filter:saturate(1.14) contrast(1.12) brightness(.9)!important;transform:scale(1.025)}.csBreakoutFX{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 76% 34%,rgba(255,255,255,.18),transparent 16%),linear-gradient(128deg,transparent 54%,rgba(225,250,255,.22) 54.2%,transparent 54.8%),linear-gradient(38deg,transparent 66%,rgba(255,255,255,.16) 66.2%,transparent 66.8%),linear-gradient(154deg,transparent 76%,rgba(85,216,255,.18) 76.2%,transparent 76.8%)}
      #csThemeRail{position:absolute;z-index:12;left:clamp(18px,4vw,62px);right:clamp(18px,4vw,62px);bottom:18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.csThemeBtn{border:1px solid rgba(120,190,235,.38);background:rgba(2,9,20,.78);color:#cfe7f8;border-radius:999px;padding:7px 11px;font:900 10px/1.1 Segoe UI,Arial,sans-serif;letter-spacing:.07em;cursor:pointer;backdrop-filter:blur(10px)}.csThemeBtn.active{color:#fff;border-color:#55d8ff;background:#0a2741;box-shadow:0 0 14px rgba(85,216,255,.45)}
      .csPokemonShelf{margin:14px 0 20px;border:1px solid #436bb5;border-radius:18px;padding:18px;background:radial-gradient(circle at 80% 0,rgba(255,213,52,.12),transparent 30%),linear-gradient(145deg,#07182a,#030a13)}.csPokemonHead{display:flex;align-items:center;gap:14px;margin-bottom:14px}.csPokemonHead img{width:150px;max-height:70px;object-fit:contain}.csPokemonHead h2{margin:0}.csPokemonGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.csPokeCard{display:block;text-decoration:none;color:#fff;border:1px solid #315e8e;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#0b2947,#06111c);transition:.18s}.csPokeCard:hover{transform:translateY(-3px);border-color:#62cbff}.csPokeVisual{height:180px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#234f85,#06111c 68%);position:relative;overflow:hidden}.csPokeVisual img{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.5))}.csPokeVisual:after{content:'CLICK TO EXPLORE';position:absolute;bottom:10px;right:10px;font-size:9px;font-weight:950;color:#ffd950;letter-spacing:.08em}.csPokeBody{padding:12px}.csPokeBody b{display:block;font-size:15px;margin-bottom:5px}.csPokeBody span{color:#9fc5df;font-size:12px;line-height:1.35}.csBreakPanel{margin:16px 0;border:1px solid #2c6d9c;border-radius:16px;padding:16px;background:linear-gradient(145deg,#0b2948,#030b14)}.csBreakGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.csBreakTile{border:1px solid #285b7f;border-radius:12px;padding:14px;background:#06131f;color:#fff;text-decoration:none}.csBreakTile b{display:block;font-size:16px;margin-bottom:5px}.csBreakTile span{font-size:12px;color:#9fc1d9}
      @media(max-width:900px){.csPokemonGrid{grid-template-columns:repeat(2,1fr)}.csBreakGrid{grid-template-columns:1fr}.csThemeBtn{font-size:9px;padding:6px 9px}}@media(max-width:520px){#csThemeRail{bottom:10px;gap:5px}.csThemeBtn{padding:5px 7px}.csPokemonGrid{grid-template-columns:1fr}}
    `;doc.head.appendChild(st)}
    let rail=doc.getElementById('csThemeRail');if(!rail){rail=doc.createElement('div');rail.id='csThemeRail';const hero=doc.querySelector('.hero');if(hero)hero.appendChild(rail)}
    rail.innerHTML='';THEMES.forEach((d,i)=>{const b=doc.createElement('button');b.className='csThemeBtn';b.textContent=d.title;b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};rail.appendChild(b)});
    const show=i=>{i=((i%slides.length)+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===i));const d=THEMES[i];const k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));win.__csThemeIndex=i;const h=doc.getElementById('hero');if(h){h.classList.remove('strike');void h.offsetWidth;h.classList.add('strike')}};
    if(!win.__csThemeRotation){win.__csThemeRotation=true;show(0);clearInterval(win.__csHeroTimer);win.__csThemeTimer=setInterval(()=>show((win.__csThemeIndex||0)+1),6500)}
    [...doc.querySelectorAll('button,a')].forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(t.includes('daily game')){el.textContent='BREAK & PLAY';if(el.tagName==='BUTTON')el.onclick=()=>{try{win.openApp&&win.openApp('game')}catch(e){}}}if((t.includes('social media')||t==='breaks'||t.includes('live breaks'))&&!el.closest('#csThemeRail')){el.style.display='none'}})
  }catch(e){console.error('Theme hero patch failed',e)}
}
function injectPokemon(doc,win){
  try{
    const path=((doc.location&&doc.location.pathname)||'').toLowerCase();if(!path.endsWith('app.html'))return;
    const content=doc.querySelector('.content');if(!content)return;
    if(!doc.getElementById('csPokemonShelf')){const shelf=doc.createElement('section');shelf.id='csPokemonShelf';shelf.className='csPokemonShelf';shelf.innerHTML=`<div class="csPokemonHead"><img src="${POKE}" alt="Pokémon TCG"><div><div class="k">POKÉMON TCG • VISUAL PRODUCT HUB</div><h2>Open the box. Know the chase.</h2><div class="sub">Clickable sealed-product cards with real destinations — no more text-only Pokémon section.</div></div></div><div class="csPokemonGrid">
      <a class="csPokeCard" href="https://www.pokemoncenter.com/search/megacards" target="_blank" rel="noopener"><div class="csPokeVisual"><img src="${POKE}" alt="Mega Evolution sealed products"></div><div class="csPokeBody"><b>Mega Evolution</b><span>Booster displays, ETBs, bundles and Mega-era chase products.</span></div></a>
      <a class="csPokeCard" href="https://www.pokemoncenter.com/category/tcg-cards?page=1" target="_blank" rel="noopener"><div class="csPokeVisual"><img src="${POKE}" alt="Pokémon TCG sealed products"></div><div class="csPokeBody"><b>Current Sealed</b><span>Browse current Pokémon TCG boxes, bundles, packs and collections.</span></div></a>
      <a class="csPokeCard" href="https://www.pokemoncenter.com/product/10-10377-109/pokemon-tcg-mega-evolution-perfect-order-booster-bundle-6-packs/" target="_blank" rel="noopener"><div class="csPokeVisual"><img src="${POKE}" alt="Perfect Order Booster Bundle"></div><div class="csPokeBody"><b>Perfect Order</b><span>Six-pack booster bundle and current Mega Evolution chase lane.</span></div></a>
      <a class="csPokeCard" href="https://www.pokemoncenter.com/category/tcg-cards" target="_blank" rel="noopener"><div class="csPokeVisual"><img src="${POKE}" alt="Pokémon chase products"></div><div class="csPokeBody"><b>Chase Products</b><span>Jump directly into the official sealed-product catalog.</span></div></a>
      </div>`;content.prepend(shelf)}
    [...doc.querySelectorAll('button,a')].forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(t.includes('pokemon')||t.includes('pokémon')){el.onclick=e=>{e.preventDefault();try{win.show&&win.show('sets')}catch(_e){}setTimeout(()=>{const s=doc.getElementById('csPokemonShelf');if(s){s.style.display='block';s.scrollIntoView({behavior:'smooth',block:'start'})}},80)}}})
  }catch(e){console.error('Pokemon shelf patch failed',e)}
}
function combineBreakPlay(doc,win){
  try{
    const path=((doc.location&&doc.location.pathname)||'').toLowerCase();if(!path.endsWith('app.html'))return;
    [...doc.querySelectorAll('button,a')].forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(t.includes('daily game')||t.includes('social media break')||t==='breaks'||t.includes('live breaks')){el.textContent=t.includes('game')?'BREAK & PLAY':el.textContent;el.onclick=e=>{e.preventDefault();try{win.show&&win.show('game')}catch(_e){}setTimeout(()=>injectBreakPanel(doc),80)}}});
    const text=(doc.querySelector('.content')?.textContent||'').toLowerCase();if(text.includes('game')||text.includes('rank'))injectBreakPanel(doc)
  }catch(e){console.error('Break Play patch failed',e)}
}
function injectBreakPanel(doc){
  const content=doc.querySelector('.content');if(!content||doc.getElementById('csBreakPanel'))return;const p=doc.createElement('section');p.id='csBreakPanel';p.className='csBreakPanel';p.innerHTML=`<div class="k">BREAK & PLAY</div><h2>Daily Card Game + Social Breaks</h2><div class="sub">One destination for the CardStorm challenge and the break content collectors are watching.</div><div class="csBreakGrid"><a class="csBreakTile" href="https://www.tiktok.com/" target="_blank" rel="noopener"><b>Social Breaks</b><span>Jump into short-form break clips and collector content.</span></a><a class="csBreakTile" href="https://www.whatnot.com/" target="_blank" rel="noopener"><b>Live Breaks</b><span>Go from the game straight into live breaking action.</span></a><a class="csBreakTile" href="https://www.youtube.com/" target="_blank" rel="noopener"><b>Break Replays</b><span>Watch longer break recaps, hits and chase moments.</span></a></div>`;content.prepend(p)
}
function patchDoc(win,doc){try{if(!win||!doc)return;doc.querySelectorAll('img').forEach(img=>{const s=(img.getAttribute('src')||'').toLowerCase(),a=(img.getAttribute('alt')||'').toLowerCase();if(s.includes('assets/logo')||a.includes('cardstorm logo')||a==='cardstorm')img.src=LOGO});installHero(win,doc);injectPokemon(doc,win);combineBreakPlay(doc,win);doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}});try{win.startTrial=stripe}catch(e){}doc.querySelectorAll('.ownerSetup,.domainStatus').forEach(el=>el.style.display='none');doc.querySelectorAll('.plan.edge').forEach(edge=>{const big=edge.querySelector('.big');if(big)big.textContent='$9.88';const sub=edge.querySelector('.sub');if(sub)sub.textContent='per month after 7-day free trial • cancel anytime'});doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csPatched){fr.dataset.csPatched='1';fr.addEventListener('load',()=>{try{patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){console.error('CardStorm patch failed',e)}}
function patchAll(){try{patchDoc(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,300);setTimeout(patchAll,1000);setTimeout(patchAll,2500)});setInterval(patchAll,1500);
</script></body></html>
