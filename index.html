<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020914"><meta name="description" content="CardStorm gives collectors card-market intelligence, verified set data, chase guidance and collector tools."><title>CardStorm Edge</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}</style></head><body><iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe><script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const LOGO='assets/logo-approved.webp';
const TRAVIS='assets/herocardfootball.webp';
const ROOKIE='https://res.cloudinary.com/rfbvfxpo/image/upload/v1787776591/cardstorm/hero/rookie-nextup.webp';
const core=document.getElementById('core');
function stripe(){top.location.href=STRIPE}
function installHero(win,doc){
  try{
    const slides=[...doc.querySelectorAll('.hero .slide')];if(slides.length<2)return;
    const data=[
      {name:'Travis Hunter',kicker:'FOOTBALL • BREAKOUT CHASE',sub:'A premium slab erupts through the Storm — glass, lightning and chase energy.',img:TRAVIS},
      {name:'Jaxson Dart',kicker:'FOOTBALL • ROOKIE BREAKOUT',sub:'A rookie slab punches through shattered glass into a dramatic CardStorm scene.',img:ROOKIE},
      {name:'Ashton Jeanty',kicker:'FOOTBALL • POWER CHASE',sub:'Card first. Slab first. Then the scene explodes out of it with storm energy.',img:TRAVIS},
      {name:'Tom Brady',kicker:'FOOTBALL • LEGEND MODE',sub:'A grail-style slab breaking through the storm with cinematic glass and lightning.',img:ROOKIE},
      {name:'Jayden Daniels',kicker:'FOOTBALL • STAR POWER',sub:'A premium football card becomes the scene as the slab bursts through shattered glass.',img:TRAVIS},
      {name:'Cam Ward',kicker:'FOOTBALL • NEXT WAVE',sub:'A rookie chase card breaks out into a near-real dramatic football scene.',img:ROOKIE},
      {name:'Paul Skenes',kicker:'BASEBALL • HEAT CHECK',sub:'The CardStorm breakout treatment moves beyond football without turning into product-box art.',img:TRAVIS},
      {name:'Victor Wembanyama',kicker:'BASKETBALL • GLOBAL CHASE',sub:'A slab-led dramatic chase visual with the same storm and shattered-glass language.',img:ROOKIE},
      {name:'Pikachu + Charizard',kicker:'POKÉMON • ICON CHASE',sub:'The chase remains card-first and cinematic across every category.',img:TRAVIS}
    ];
    slides.forEach((slide,i)=>{
      const d=data[i%data.length];slide.dataset.player=d.name;slide.dataset.kicker=d.kicker;slide.dataset.sub=d.sub;
      slide.querySelectorAll('.csTeamBadge,.csTeamMark').forEach(x=>x.remove());
      const img=slide.querySelector('.heroimg');if(img){img.className='heroimg csSlabHero';img.src=d.img;img.alt=d.name+' dramatic CardStorm slab breakout';img.onerror=()=>{img.onerror=null;img.src=TRAVIS}};
      if(!slide.querySelector('.csBreakoutFX')){const fx=doc.createElement('div');fx.className='csBreakoutFX';slide.appendChild(fx)}
    });
    if(!doc.getElementById('csSlabHeroStyle')){const st=doc.createElement('style');st.id='csSlabHeroStyle';st.textContent=`
      .hero .slide{background:radial-gradient(circle at 76% 44%,rgba(68,172,255,.28),transparent 26%),linear-gradient(120deg,#020914 0%,#071827 45%,#0b2740 72%,#020914 100%)!important}
      .hero .slide .heroimg.csSlabHero{object-fit:cover!important;object-position:center!important;width:100%!important;height:100%!important;left:0!important;right:0!important;top:0!important;bottom:0!important;padding:0!important;filter:saturate(1.14) contrast(1.12) brightness(.92)!important;transform:scale(1.025)}
      .csBreakoutFX{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 76% 34%,rgba(255,255,255,.18),transparent 16%),linear-gradient(128deg,transparent 54%,rgba(225,250,255,.22) 54.2%,transparent 54.8%),linear-gradient(38deg,transparent 66%,rgba(255,255,255,.16) 66.2%,transparent 66.8%),linear-gradient(154deg,transparent 76%,rgba(85,216,255,.18) 76.2%,transparent 76.8%),linear-gradient(20deg,transparent 84%,rgba(255,255,255,.11) 84.2%,transparent 84.7%)}
      .dots{gap:8px!important;align-items:center}.dot{width:48px!important;height:32px!important;border-radius:8px!important;overflow:hidden!important;border:1px solid #31516a!important;background:#071522!important;padding:0!important}.dot img{width:100%!important;height:100%!important;object-fit:cover!important}.dot.active{border-color:#55d8ff!important;box-shadow:0 0 14px rgba(85,216,255,.72)!important}
      @media(max-width:760px){.hero .slide .heroimg.csSlabHero{object-position:center!important;transform:scale(1.06)}.dot{width:38px!important;height:27px!important}}
    `;doc.head.appendChild(st)}
    const dots=[...doc.querySelectorAll('.dot')];dots.forEach((dot,i)=>{const d=data[i%data.length];dot.innerHTML='';const im=doc.createElement('img');im.src=d.img;im.alt=d.name+' hero thumbnail';im.onerror=()=>{im.onerror=null;im.src=TRAVIS};dot.appendChild(im);dot.title=d.name});
    const show=i=>{i=((i%slides.length)+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===i));const d=data[i%data.length];const k=doc.getElementById('heroKicker'),s=doc.getElementById('heroSub'),n=doc.getElementById('starName'),num=doc.getElementById('slideNum');if(k)k.textContent=d.kicker;if(s)s.textContent=d.sub;if(n)n.textContent=d.name;if(num)num.textContent='FEATURED CHASE '+String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');dots.forEach((x,j)=>x.classList.toggle('active',j===i));win.__csHeroIndex=i;const h=doc.getElementById('hero');if(h){h.classList.remove('strike');void h.offsetWidth;h.classList.add('strike')}};
    if(!win.__csSlabRotation){win.__csSlabRotation=true;show(0);win.__csHeroTimer=setInterval(()=>show((win.__csHeroIndex||0)+1),6000);doc.addEventListener('click',e=>{const dot=e.target.closest&&e.target.closest('.dot');if(dot){const i=dots.indexOf(dot);if(i>=0)show(i)}},true)}
  }catch(e){console.error('Slab hero patch failed',e)}
}
function patchDoc(win,doc){try{if(!win||!doc)return;doc.querySelectorAll('img').forEach(img=>{const s=(img.getAttribute('src')||'').toLowerCase(),a=(img.getAttribute('alt')||'').toLowerCase();if(s.includes('assets/logo')||a.includes('cardstorm logo')||a==='cardstorm')img.src=LOGO});installHero(win,doc);doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}});try{win.startTrial=stripe}catch(e){}doc.querySelectorAll('.ownerSetup,.domainStatus').forEach(el=>el.style.display='none');doc.querySelectorAll('.plan.edge').forEach(edge=>{const big=edge.querySelector('.big');if(big)big.textContent='$9.88';const sub=edge.querySelector('.sub');if(sub)sub.textContent='per month after 7-day free trial • cancel anytime'});doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csPatched){fr.dataset.csPatched='1';fr.addEventListener('load',()=>{try{patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){console.error('CardStorm patch failed',e)}}
function patchAll(){try{patchDoc(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,300);setTimeout(patchAll,1000);setTimeout(patchAll,2500)});setInterval(patchAll,1500);
</script></body></html>
