const style=doc.createElement('style');style.id='csHardNoHeadshots';style.textContent=`.hero .heroimg{display:none!important;visibility:hidden!important;opacity:0!important}.starPlate{display:none!important}.brand img{content:url('assets/logo.png')!important;height:58px!important;max-width:280px!important;object-fit:contain!important}.hero{min-height:min(610px,72vh)!important;border-radius:18px!important;background:#020914!important;overflow:hidden!important}.hero .shade{z-index:3!important;background:linear-gradient(90deg,rgba(1,7,15,.98) 0%,rgba(1,7,15,.91) 31%,rgba(1,7,15,.25) 61%,rgba(1,7,15,.08) 100%),linear-gradient(0deg,rgba(2,9,20,.84),transparent 40%)!important}.heroCopy{z-index:6!important;max-width:680px!important}.hero h1,.hero p,.heroPill,.eyebrow,.hero button{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif!important;font-style:normal!important}.hero h1{font-weight:950!important;letter-spacing:-.045em!important}.csFixedScene{position:absolute;inset:0;z-index:1;overflow:hidden;background:radial-gradient(circle at 78% 43%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 31%),linear-gradient(125deg,#020914,#071827 48%,#0d2a42 75%,#020914)}.csFixedScene:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 84% 14%,rgba(255,255,255,.95) 0 1%,rgba(85,216,255,.22) 2%,transparent 9%),linear-gradient(125deg,transparent 56%,rgba(220,249,255,.18) 56.3%,transparent 57%),linear-gradient(42deg,transparent 72%,rgba(255,255,255,.12) 72.2%,transparent 73%)}.csFixedSlab{position:absolute;right:8%;top:7%;width:39%;height:78%;border:2px solid rgba(190,239,255,.25);border-radius:22px;transform:rotate(-5deg);box-shadow:0 0 0 8px rgba(255,255,255,.025),0 0 52px color-mix(in srgb,var(--accent) 25%,transparent),inset 0 0 35px rgba(255,255,255,.04)}.csFixedArt{position:absolute;right:2%;top:4%;width:54%;height:88%;object-fit:contain;object-position:center;z-index:2;filter:drop-shadow(0 32px 48px rgba(0,0,0,.8))
