<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CardStormGuide</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}iframe{display:block;width:100%;height:100%;border:0;background:#020914}</style></head>
<body><iframe id="cardstorm" src="/legacy-home.html?cardstorm-home-v5=1" title="CardStormGuide"></iframe><script>
const frame=document.getElementById('cardstorm');
function polish(){const d=frame.contentDocument;if(!d||!d.body||d.getElementById('cardstormV5Patch'))return;
const st=d.createElement('style');st.id='cardstormV5Patch';st.textContent=`
.brand .tag{display:none!important}.brand{min-width:210px!important}.brand img{height:62px!important;width:auto!important;max-width:235px!important;object-fit:contain!important}
.hero{min-height:min(600px,70vh)!important;height:auto!important;aspect-ratio:auto!important;overflow:hidden!important;background:#020914!important}.scene.photo .bg img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;transform:none!important;filter:saturate(1.10) contrast(1.04) brightness(1.08)!important}.heroBrandLock,.heroCta,.heroNavOverlay{display:none!important}.heroCopy{display:flex!important}.shade{display:block!important;background:linear-gradient(90deg,rgba(1,7,15,.78) 0%,rgba(1,7,15,.50) 31%,rgba(1,7,15,.08) 59%,transparent 76%)!important}.hero h1,.hero h1 span{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important;font-style:normal!important;font-weight:950!important;letter-spacing:-.045em!important}.hero h1{line-height:.92!important}.hero p{max-width:520px!important}.heroPill{font-family:Inter,ui-sans-serif,system-ui!important;font-style:normal!important}.actions{display:flex!important}
#starRail{display:none!important}.mobDots{display:flex!important;position:absolute!important;z-index:12!important;left:50%!important;bottom:15px!important;transform:translateX(-50%)!important;margin:0!important}
.cmdStack{gap:12px!important}.cmdGrid,.cmdGrid.cmdGrid3{grid-template-columns:repeat(8,minmax(0,1fr))!important;max-width:none!important;margin:0!important;gap:12px!important}.cmdCard{min-height:0!important;border-radius:12px!important}.cmdCardArt{height:150px!important}.cmdCardBody{padding:11px 10px 12px!important}.cmdCard h3{font-size:15px!important;line-height:1.05!important}.cmdCard p{font-size:10.5px!important;line-height:1.3!important}.cmdCardArt img{filter:saturate(1.10) brightness(1.08) contrast(1.03)!important}.sectionTitle{margin:22px 0 10px!important}.sectionTitle h2{font-size:25px!important}
@media(max-width:1200px){.cmdGrid,.cmdGrid.cmdGrid3{grid-template-columns:repeat(4,minmax(0,1fr))!important}.cmdCardArt{height:175px!important}}
@media(max-width:980px){.cmdGrid,.cmdGrid.cmdGrid3{grid-template-columns:repeat(2,minmax(0,1fr))!important}.shade{background:linear-gradient(180deg,transparent 0,rgba(2,9,20,.08) 30%,#061421 54%,#020914 72%)!important}.heroCopy{justify-content:flex-end!important;padding-bottom:52px!important}.cmdCardArt{height:190px!important}}
@media(max-width:620px){.cmdGrid,.cmdGrid.cmdGrid3{grid-template-columns:1fr!important}.cmdCardArt{height:210px!important}}
`;d.head.appendChild(st);
// remove all temporary overlays from prior patch
['.heroBrandLock','.heroCta','.heroNavOverlay'].forEach(s=>d.querySelectorAll(s).forEach(n=>n.remove()));
// one rookie slide: Rookie Stars artwork/copy becomes Rookies
const buttons=[...d.querySelectorAll('.starBtn')],rookieBtn=buttons.find(b=>(b.innerText||'').trim().toUpperCase()==='ROOKIES'),starsBtn=buttons.find(b=>(b.innerText||'').toUpperCase().includes('ROOKIE STARS'));if(rookieBtn)rookieBtn.style.display='none';if(starsBtn){[...starsBtn.childNodes].forEach(n=>{if(n.nodeType===3&&n.textContent.includes('ROOKIE STARS'))n.textContent=n.textContent.replace('ROOKIE STARS','ROOKIES')});starsBtn.click();}
// keep only the approved eight command-center destinations
[...d.querySelectorAll('.cmdCard')].forEach(c=>{const t=(c.innerText||'').toUpperCase();if(t.includes('CHECKLISTS')||t.includes('DOWNTOWN /')||t.includes('DOWNTOWN/UPTOWN')||t.includes('NEVER MISS'))c.remove();});
[...d.querySelectorAll('.cmdCard')].forEach(c=>{const t=(c.innerText||'').toUpperCase();if(t.includes('KNOW MORE')||t.includes('COLLECT SMARTER')){const h3=c.querySelector('h3');if(h3)h3.innerHTML='COLLECTOR <span>INTEL</span>';const p=c.querySelector('p');if(p)p.textContent='Data. Insights. Smarter moves.';}});
const grids=[...d.querySelectorAll('.cmdGrid')];if(grids.length){const first=grids[0],visible=[...d.querySelectorAll('.cmdCard')];first.innerHTML='';visible.forEach(c=>first.appendChild(c));grids.slice(1).forEach(g=>g.remove());first.classList.remove('cmdGrid3');}
const section=d.querySelector('.sectionTitle p');if(section)section.textContent='Eight focused destinations. No clutter. Just the tools collectors actually use.';
// restore the original built-in hero copy/buttons and make routes explicit
const kicker=d.getElementById('heroKicker'),h=d.querySelector('#hero h1'),p=d.getElementById('heroSub'),primary=d.getElementById('heroPrimary'),secondary=d.getElementById('heroSecondary');
const cfg={
'THE NEXT GENERATION':['ROOKIE SEASON','ROOKIES TODAY.<br><span>STARS TOMORROW.</span>','Discover the rookies, track their rise, and find the cards before the hobby does.','EXPLORE ROOKIES →','VIEW TOP MOVERS','hunt','market'],
'BREAKOUT WATCH':['ROOKIE SEASON','ROOKIES TODAY.<br><span>STARS TOMORROW.</span>','Discover the rookies, track their rise, and find the cards before the hobby does.','EXPLORE ROOKIES →','VIEW TOP MOVERS','hunt','market'],
'LEGENDS NEVER FADE':['GOATS','ICONIC PLAYERS.<br><span>TIMELESS CARDS.</span>','Explore the legends, their most iconic cards, and the value that never fades.','EXPLORE GOATS →','VIEW LEGEND LIST','market','market'],
'THE CARDS EVERYONE WANTS':['HOLY GRAILS','THE RAREST CARDS.<br><span>THE BIGGEST CHASES.</span>','Explore the holy grails, track values, and see what collectors are chasing now.','EXPLORE HOLY GRAILS →','VIEW TOP CHASES','market','market'],
'BUILD YOUR PERSONAL HUNT':['BREAK CENTER','REAL BREAKS.<br><span>REAL HITS.</span>','Find live and upcoming breaks, check team availability, and chase the biggest hits with the CardStorm community.','ENTER BREAK CENTER →','VIEW UPCOMING BREAKS','breaks','breaks'],
'PLAY. LEARN. COLLECT SMARTER.':['KNOW THE WORTH','REAL DATA.<br><span>REAL ANSWERS.</span>','Check current values, view market trends, and make smarter decisions.','CHECK A CARD →','VIEW MARKET TRENDS','market','market'],
'THE TCG CHASE':['POKÉMON / TCG','COLLECT. BATTLE.<br><span>BELONG.</span>','Explore top sets, track values, and dive into the world of Pokémon TCG.','EXPLORE POKÉMON →','VIEW TOP CARDS','tcg','tcg']};
function apply(){if(!kicker)return;const c=cfg[kicker.textContent.trim()];if(!c)return;kicker.textContent=c[0];if(h)h.innerHTML=c[1];if(p)p.textContent=c[2];if(primary){primary.textContent=c[3];primary.onclick=()=>d.defaultView.openScreen&&d.defaultView.openScreen(c[5])}if(secondary){secondary.textContent=c[4];secondary.onclick=()=>d.defaultView.openScreen&&d.defaultView.openScreen(c[6])}}
apply();if(kicker)new MutationObserver(apply).observe(kicker,{childList:true,subtree:true,characterData:true});
}
frame.addEventListener('load',()=>{try{polish()}catch(e){console.error(e)}});
</script></body></html>
