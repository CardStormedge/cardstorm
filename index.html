.sectionTitle{margin-top:34px!important;border-top:1px solid rgba(85,216,255,.1);padding-top:24px}.sectionTitle .eyebrow{font-size:10px!important;letter-spacing:.19em!important}.sectionTitle h2{font-size:clamp(24px,2.15vw,34px)!important;letter-spacing:-.03em!important;max-width:760px}.sectionTitle p{color:#7892a7!important}.grid{gap:14px!important}.card{min-height:210px!important;padding:24px 22px 22px!important;border:1px solid rgba(111,169,210,.18)!important;border-radius:14px!important;background:linear-gradient(155deg,rgba(9,30,49,.96),rgba(3,12,22,.98))!important;box-shadow:inset 0 1px rgba(255,255,255,.025);overflow:hidden}.card:before{content:attr(data-cs-index);position:absolute;right:15px;top:7px;color:rgba(135,191,229,.075);font-size:66px;font-weight:950;letter-spacing:-.08em}.card:hover{transform:translateY(-2px)!important;border-color:rgba(85,216,255,.5)!important;background:linear-gradient(155deg,rgba(12,39,64,.98),rgba(3,14,25,.98))!important;box-shadow:0 20px 45px -30px rgba(40,160,240,.55)}.card .icon{display:none!important}.card .csCardKicker{display:block;color:#66d8ff;font-size:9px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;margin:0 0 38px}.card h3{font-size:22px!important;letter-spacing:-.025em!important;margin:0 0 9px!important}.card p{font-size:12px!important;line-height:1.58!important;color:#95adbf!important;max-width:92%}.card .arrow{right:19px!important;bottom:18px!important;font-size:18px!important;color:#76ddff!important}.card.fun{border-color:rgba(111,169,210,.18)!important;background:linear-gradient(155deg,rgba(9,30,49,.96),rgba(3,12,22,.98))!important}.card.fun .arrow{color:#76ddff!important}.funStrip{gap:14px!important}.feature{border-radius:14px!important;border-color:rgba(111,169,210,.18)!important;background:linear-gradient(155deg,rgba(9,30,49,.96),rgba(3,12,22,.98))!important;padding:26px!important}.feature.gold{border-color:rgba(111,169,210,.18)!important;background:linear-gradient(155deg,rgba(9,30,49,.96),rgba(3,12,22,.98))!important}.feature h3{letter-spacing:-.03em!important}.footer{border-top:1px solid rgba(85,216,255,.08);margin-top:28px;padding-top:22px!important;color:#60798e!important}

function premiumChrome(doc){addPremiumStyle(doc);const path=((doc.location&&doc.location.pathname)||'').toLowerCase();const top=doc.querySelector('.top');if(top){let logo=top.querySelector('.logo,.logoImg,.csGlobalBrand');if(!logo){logo=doc.createElement('img');logo.className='csGlobalBrand';logo.alt='CardStorm';top.prepend(logo)}logo.src=HLOGO}const brand=doc.querySelector('.brand img');if(brand)brand.src=HLOGO;doc.querySelectorAll('.grid .card').forEach((card,i)=>{card.dataset.csIndex=String(i+1).padStart(2,'0');let k=card.querySelector('.csCardKicker');if(!k){k=doc.createElement('span');k.className='csCardKicker';card.insertBefore(k,card.firstChild)}const h=(card.querySelector('h3')?.textContent||'').toLowerCase();k.textContent=h.includes('hunt')?'CHASE INTELLIGENCE':h.includes('market')?'MARKET SIGNALS':h.includes('set')?'PRODUCT INTELLIGENCE':h.includes('game')||h.includes('challenge')?'BREAK & PLAY':h.includes('watch')?'COLLECTOR WATCHLIST':h.includes('alive')||h.includes('break')?'SOCIAL BREAKS':'CARDSTORM EDGE'});doc.querySelectorAll('.icon').forEach(x=>x.setAttribute('aria-hidden','true'))}
function installHero(win,doc){const all=[...doc.querySelectorAll('.hero .slide')];if(!all.length)return;const slides=all.slice(0,THEMES.length);all.slice(THEMES.length).forEach(s=>s.style.display='none');slides.forEach((slide,i)=>{const d=THEMES[i];slide.style.display='block';const img=slide.querySelector('.heroimg');if(img){img.src=d.img;img.alt='CardStorm '+d.title;img.style.objectFit='cover';img.style.objectPosition='center';img.onerror=()=>{img.onerror=null;img.src=TRAVIS}}});let rail=doc.getElementById('csThemeRail');if(!rail){rail=doc.createElement('div');rail.id='csThemeRail';doc.querySelector('.hero')?.appendChild(rail)}rail.innerHTML='';const show=i=>{i=((i%slides.length)+slides.length)%slides.length;slides.forEach((s,n)=>s.classList.toggle('active',n===i));const d=THEMES[i];const k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));win.__csThemeIndex=i;const h=doc.getElementById('hero');if(h){h.classList.remove('strike');void h.offsetWidth;h.classList.add('strike')}};THEMES.forEach((d,i)=>{const b=doc.createElement('button');b.className='csThemeBtn';b.textContent=d.title;b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};rail.appendChild(b)});if(!win.__csPremiumHero){win.__csPremiumHero=true;clearInterval(win.__csHeroTimer);show(0);win.__csThemeTimer=setInterval(()=>show((win.__csThemeIndex||0)+1),6500)}}
function injectPokemon(doc,win){const path=((doc.location&&doc.location.pathname)||'').toLowerCase();if(!path.endsWith('app.html'))return;const content=doc.querySelector('.content');if(!content||doc.getElementById('csPokemonShelf'))return;const s=doc.createElement('section');s.id='csPokemonShelf';s.className='csPokemonShelf';s.innerHTML=`<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px"><img src="${POKE}" alt="Pokemon TCG" style="width:170px;max-height:74px;object-fit:contain"><div><div class="k">POKÉMON TCG</div><h2 style="margin:3px 0">Sealed product. Real chases. Visual first.</h2><div class="sub">Clickable product lanes instead of text-only placeholders.</div></div></div><div class="csPokemonGrid"><a class="csPokeCard" href="https://www.pokemoncenter.com/category/tcg-cards" target="_blank"><div class="csPokeVisual"><img src="${POKE}"></div><div class="csPokeBody"><b>Current Sealed</b><span>Boxes, bundles, ETBs and packs.</span></div></a><a class="csPokeCard" href="https://www.pokemoncenter.com/search/megacards" target="_blank"><div class="csPokeVisual"><img src="${POKE}"></div><div class="csPokeBody"><b>Mega Evolution</b><span>Current Mega-era sealed chase lane.</span></div></a><a class="csPokeCard" href="https://www.pokemoncenter.com/category/tcg-cards" target="_blank"><div class="csPokeVisual"><img src="${POKE}"></div><div class="csPokeBody"><b>Collector Boxes</b><span>Premium collections and special sets.</span></div></a><a class="csPokeCard" href="https://www.pokemoncenter.com/category/tcg-cards" target="_blank"><div class="csPokeVisual"><img src="${POKE}"></div><div class="csPokeBody"><b>Chase Radar</b><span>Jump into the active Pokémon catalog.</span></div></a></div>`;content.prepend(s)}
function injectBreakPanel(doc){const c=doc.querySelector('.content');if(!c||doc.getElementById('csBreakPanel'))return;const p=doc.createElement('section');p.id='csBreakPanel';p.className='csBreakPanel';p.innerHTML=`<div class="k">BREAK & PLAY</div><h2>Daily Card Game + Social Breaks</h2><div class="sub" style="margin-bottom:14px">One destination for competition, community and break action.</div><div class="csBreakGrid"><a class="csBreakTile" href="https://www.tiktok.com/" target="_blank"><b>Social Breaks</b><span>Short-form hits, reactions and collector content.</span></a><a class="csBreakTile" href="https://www.whatnot.com/" target="_blank"><b>Live Breaks</b><span>Jump directly into live breaking action.</span></a><a class="csBreakTile" href="https://www.youtube.com/" target="_blank"><b>Break Replays</b><span>Long-form recaps, hits and chase moments.</span></a></div>`;c.prepend(p)}
function patchDoc(win,doc){try{if(!win||!doc)return;premiumChrome(doc);installHero(win,doc);const path=((doc.location&&doc.location.pathname)||'').toLowerCase();if(path.endsWith('app.html')){injectPokemon(doc,win);const txt=(doc.querySelector('.content')?.textContent||'').toLowerCase();if(txt.includes('game')||txt.includes('rank'))injectBreakPanel(doc)}doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}if(t.includes('daily game'))el.textContent='BREAK & PLAY'});doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csPremium){fr.dataset.csPremium='1';fr.addEventListener('load',()=>{try{patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){console.error('CardStorm premium patch failed',e)}}
function patchAll(){try{patchDoc(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,250);setTimeout(patchAll,900);setTimeout(patchAll,2200)});setInterval(patchAll,1800);
