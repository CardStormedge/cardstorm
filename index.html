<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="description" content="CardStorm collector intelligence">
<title>CardStorm Edge</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}</style>
</head>
<body>
<iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe>
<script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const core=document.getElementById('core');
const HOME_THEMES=[
 {title:'ROOKIES',kicker:'THE FUTURE BREAKS HERE',sub:'Rookie heat, first-year cards and the next generation of hobby stars.',mode:'rookies'},
 {title:'GOATs',kicker:'LEGENDS NEVER FADE',sub:'The all-time names and cards that define the ceiling of the hobby.',mode:'goats'},
 {title:'HOLY GRAILS',kicker:'THE RAREST OF THE RARE',sub:'Collection-defining cards, impossible chases and true centerpieces.',mode:'grails'},
 {title:'CASE HITS',kicker:'BIGGER PULLS. BIGGER MOMENTS.',sub:'SSPs, case hits and the pulls that stop a break cold.',mode:'case'},
 {title:'DOWNTOWN / UPTOWN',kicker:'ART MEETS THE HOBBY',sub:'The iconic art inserts collectors recognize instantly.',mode:'downtown'},
 {title:'BREAK & PLAY',kicker:'GAME • BREAKS • COMMUNITY',sub:'CardStorm games and social-break energy in one collector lane.',mode:'break'},
 {title:'POKÉMON',kicker:'CATCH THE STORM',sub:'Pokémon sets, chase cards and TCG collector heat.',mode:'pokemon'}
];
let CARD_ART=null;
function stripe(){top.location.href=STRIPE}
function returnToNewHome(){try{const cw=core.contentWindow,cd=core.contentDocument;if(!cw||!cd)return;const layer=cd.getElementById('appLayer');if(layer)layer.classList.remove('open');cd.body.style.overflow='';if(typeof cw.scheduleStorm==='function')cw.scheduleStorm(true);cw.scrollTo(0,0)}catch(e){}}
function chooseCardArt(data){
 const cards=(Array.isArray(data)?data:[]).filter(x=>x&&x.img&&String(x.img).startsWith('data:image'));
 const sorted=[...cards].sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0));
 const used=new Set();
 const take=(test)=>{let c=sorted.find(x=>!used.has(x.id||x.player+x.card)&&test(x));if(!c)c=sorted.find(x=>!used.has(x.id||x.player+x.card));if(c)used.add(c.id||c.player+x.card);return c||null};
 const rookie=take(x=>/dart|jeanty|hunter|ward|daniels|rookie/i.test((x.player||'')+' '+(x.card||'')));
 const goat=take(x=>/brady|mahomes|jordan|lebron|kobe|curry|ohtani|trout|griffey|jeter|montana|manning|rice/i.test(x.player||''));
 const grail=take(()=>true);
 const caseHit=take(x=>/kaboom|color blast|genesis|stained glass|manga|color wheel|night moves|home field|case hit|ssp/i.test(x.card||''));
 const downtown=take(x=>/downtown|uptown/i.test(x.card||''));
 const break1=take(()=>true),break2=take(()=>true),break3=take(()=>true);
 return {rookie,goat,grail,caseHit,downtown,breakCards:[break1,break2,break3].filter(Boolean)};
}
async function loadCardArt(){if(CARD_ART)return CARD_ART;try{const r=await fetch('game-data.json',{cache:'no-store'});CARD_ART=chooseCardArt(await r.json())}catch(e){CARD_ART={}}return CARD_ART}
function ensureStyles(doc){
 if(doc.getElementById('csCollectorFix'))return;
 const st=doc.createElement('style');st.id='csCollectorFix';st.textContent=`
 .hero .slide{background:#04101b!important;overflow:hidden!important}
 .hero .slide .heroimg{display:none!important}
 .hero .slide[data-cs-mode="rookies"] .heroimg{display:block!important;visibility:visible!important;opacity:1!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 35%!important;filter:saturate(1.08) contrast(1.08)!important}
 .hero .shade{background:linear-gradient(90deg,rgba(1,7,15,.98) 0%,rgba(1,7,15,.88) 30%,rgba(1,7,15,.24) 56%,rgba(1,7,15,.06) 100%),linear-gradient(0deg,rgba(2,9,20,.78),transparent 36%)!important}
 .starPlate{display:none!important}
 .csScene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
 .csSceneBg{position:absolute;inset:-7%;width:114%;height:114%;object-fit:cover;filter:blur(28px) saturate(1.4) brightness(.56) contrast(1.15);transform:scale(1.08)}
 .csSceneWash{position:absolute;inset:0;background:radial-gradient(circle at 78% 44%,rgba(74,205,255,.34),transparent 34%),linear-gradient(120deg,transparent 38%,rgba(255,255,255,.08) 48%,transparent 58%)}
 .csHeroCard{position:absolute;right:2.5%;top:-7%;height:116%;width:auto;max-width:58%;object-fit:contain;filter:drop-shadow(0 35px 55px rgba(0,0,0,.65));transform:rotate(-4deg) scale(1.04)}
 .csHeroCard.alt{right:24%;top:4%;height:92%;opacity:.34;filter:blur(.4px) saturate(.8) brightness(.72);transform:rotate(8deg) scale(.98)}
 .csHeroCard.alt2{right:-9%;top:10%;height:88%;opacity:.27;filter:blur(.6px) saturate(.8) brightness(.65);transform:rotate(-13deg) scale(.96)}
 .csLightning{position:absolute;right:5%;top:0;width:58%;height:100%;background:linear-gradient(116deg,transparent 0 42%,rgba(94,216,255,.12) 42.5% 43.2%,transparent 43.7% 55%,rgba(255,255,255,.12) 55.5% 56.2%,transparent 56.7%);mix-blend-mode:screen}
 .csThemeGOATs .csSceneWash{background:radial-gradient(circle at 76% 42%,rgba(215,230,244,.34),transparent 36%),linear-gradient(110deg,transparent 35%,rgba(255,255,255,.09),transparent 61%)}
 .csThemeHOLYGRAILS .csSceneWash{background:radial-gradient(circle at 77% 43%,rgba(255,194,45,.42),transparent 34%),linear-gradient(110deg,transparent 34%,rgba(255,222,120,.1),transparent 61%)}
 .csThemeCASEHITS .csSceneWash{background:radial-gradient(circle at 77% 43%,rgba(255,71,84,.4),transparent 34%),linear-gradient(110deg,transparent 34%,rgba(255,255,255,.09),transparent 61%)}
 .csThemeDOWNTOWNUPTOWN .csSceneWash{background:radial-gradient(circle at 77% 43%,rgba(75,165,255,.42),transparent 34%),linear-gradient(0deg,rgba(3,18,34,.5),transparent 45%)}
 .csCity{position:absolute;right:-2%;bottom:0;width:63%;height:32%;background:repeating-linear-gradient(90deg,rgba(40,119,176,.42) 0 42px,rgba(8,24,41,.75) 42px 74px);clip-path:polygon(0 65%,7% 30%,13% 58%,20% 12%,28% 49%,34% 24%,42% 62%,50% 18%,59% 48%,68% 8%,76% 53%,84% 27%,92% 60%,100% 36%,100% 100%,0 100%);opacity:.72}
 .csBreakGrid{position:absolute;right:0;top:0;width:66%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px;box-sizing:border-box;transform:skewX(-4deg)}
 .csBreakTile{position:relative;overflow:hidden;border:1px solid rgba(117,191,240,.22);background:#071524}
 .csBreakTile img{width:100%;height:100%;object-fit:cover;filter:saturate(1.18) contrast(1.06)}
 .csBreakTile:first-child{grid-row:1/3}.csBreakTile:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(3,10,18,.5))}
 .csPokemonStorm{position:absolute;inset:0;background:radial-gradient(circle at 76% 42%,rgba(255,224,67,.38),transparent 28%),radial-gradient(circle at 82% 52%,rgba(66,150,255,.36),transparent 40%),linear-gradient(135deg,#04101d 0,#102a4b 52%,#5a490a 100%)}
 .csPokemonLogo{position:absolute;right:3%;top:7%;width:54%;height:86%;object-fit:contain;filter:drop-shadow(0 30px 50px rgba(0,0,0,.58)) drop-shadow(0 0 30px rgba(255,216,54,.24))}
 .csPokemonBurst{position:absolute;right:10%;top:6%;width:46%;height:88%;background:conic-gradient(from 8deg,transparent 0 7deg,rgba(255,232,103,.2) 7deg 9deg,transparent 9deg 23deg,rgba(91,191,255,.18) 23deg 25deg,transparent 25deg 42deg);border-radius:50%;filter:blur(.3px)}
 #csThemeRail{position:absolute;z-index:8;left:clamp(20px,4vw,64px);right:clamp(20px,4vw,64px);bottom:18px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
 #csThemeRail::-webkit-scrollbar{display:none}.csThemeBtn{flex:0 0 auto;border:1px solid rgba(104,177,226,.3);background:rgba(2,9,20,.82);color:#b9cbd9;border-radius:7px;padding:9px 12px;font-size:10px;font-weight:900;letter-spacing:.08em;cursor:pointer}.csThemeBtn.active{color:#fff;border-color:#55d8ff;background:#0a2741;box-shadow:0 0 14px rgba(85,216,255,.22)}
 .grid{gap:0!important;border-top:1px solid rgba(79,132,172,.22)!important;border-left:1px solid rgba(79,132,172,.22)!important}.grid .card{border:0!important;border-right:1px solid rgba(79,132,172,.22)!important;border-bottom:1px solid rgba(79,132,172,.22)!important;border-radius:0!important;background:linear-gradient(155deg,rgba(8,26,43,.86),rgba(3,12,22,.96))!important;box-shadow:none!important}.grid .card .icon{display:none!important}.grid .card h3{margin-top:42px!important}.grid .card:before{content:attr(data-cs-index);position:absolute;top:18px;left:18px;color:#55d8ff;font-size:10px;font-weight:900;letter-spacing:.18em}.grid .card:hover{transform:none!important;box-shadow:inset 0 3px 0 #55d8ff!important}.funStrip .feature{border-radius:0!important}.funStrip .feature.gold{background:linear-gradient(155deg,rgba(8,26,43,.86),rgba(3,12,22,.96))!important;border-color:#2d648c!important}
 @media(max-width:760px){.heroCopy{padding-bottom:115px!important}.csThemeBtn{padding:8px 9px;font-size:9px}.csHeroCard{right:-18%;top:0;height:93%;max-width:78%}.csHeroCard.alt{right:11%;height:76%}.csHeroCard.alt2{right:-24%;height:70%}.csBreakGrid{width:74%;right:-16%;padding:10px;gap:8px}.csPokemonLogo{right:-8%;width:72%}}
 `;doc.head.appendChild(st);
}
function clearScene(slide){slide.querySelectorAll('.csScene').forEach(x=>x.remove())}
function addFullScene(doc,slide,primary,extras=[],mode=''){
 clearScene(slide);if(!primary||!primary.img)return;
 const scene=doc.createElement('div');scene.className='csScene';
 const bg=doc.createElement('img');bg.className='csSceneBg';bg.src=primary.img;scene.appendChild(bg);
 const wash=doc.createElement('div');wash.className='csSceneWash';scene.appendChild(wash);
 if(mode==='downtown'){const city=doc.createElement('div');city.className='csCity';scene.appendChild(city)}
 if(extras[0]&&extras[0].img){const a=doc.createElement('img');a.className='csHeroCard alt';a.src=extras[0].img;scene.appendChild(a)}
 if(extras[1]&&extras[1].img){const a=doc.createElement('img');a.className='csHeroCard alt2';a.src=extras[1].img;scene.appendChild(a)}
 const p=doc.createElement('img');p.className='csHeroCard';p.src=primary.img;p.alt='Collector card';scene.appendChild(p);
 const bolt=doc.createElement('div');bolt.className='csLightning';scene.appendChild(bolt);
 slide.appendChild(scene);
}
function addBreakScene(doc,slide,cards){
 clearScene(slide);const scene=doc.createElement('div');scene.className='csScene';
 const wash=doc.createElement('div');wash.className='csSceneWash';scene.appendChild(wash);
 const grid=doc.createElement('div');grid.className='csBreakGrid';(cards||[]).slice(0,3).forEach(c=>{if(!c||!c.img)return;const t=doc.createElement('div');t.className='csBreakTile';const i=doc.createElement('img');i.src=c.img;i.alt='';t.appendChild(i);grid.appendChild(t)});scene.appendChild(grid);
 const bolt=doc.createElement('div');bolt.className='csLightning';scene.appendChild(bolt);slide.appendChild(scene);
}
function addPokemonScene(doc,slide){clearScene(slide);const scene=doc.createElement('div');scene.className='csScene';const bg=doc.createElement('div');bg.className='csPokemonStorm';scene.appendChild(bg);const burst=doc.createElement('div');burst.className='csPokemonBurst';scene.appendChild(burst);const logo=doc.createElement('img');logo.className='csPokemonLogo';logo.src='assets/pokemontcglogo.webp';logo.alt='Pokémon Trading Card Game';scene.appendChild(logo);slide.appendChild(scene)}
async function patchHomepageThemes(win,doc){
 try{
  const hero=doc.querySelector('.hero'),slides=[...doc.querySelectorAll('.hero .slide')];if(!hero||slides.length<7)return;ensureStyles(doc);const art=await loadCardArt();
  slides.forEach((slide,i)=>{
   if(i<7){const theme=HOME_THEMES[i];slide.style.display='block';slide.classList.remove('categorySlide','pokemonSlide');slide.className=slide.className.replace(/\bcsTheme\S+/g,'').trim();slide.classList.add('csTheme'+theme.title.replace(/[^A-Za-z]/g,''));slide.dataset.theme=theme.title;slide.dataset.csMode=theme.mode;let img=slide.querySelector('.heroimg');if(!img){img=doc.createElement('img');img.className='heroimg';slide.prepend(img)}
    if(theme.mode==='rookies'){img.src='assets/herocardfootball.webp';img.alt='CardStorm rookie chase';clearScene(slide)}
    if(theme.mode==='goats')addFullScene(doc,slide,art.goat,[art.grail,art.caseHit],'goats');
    if(theme.mode==='grails')addFullScene(doc,slide,art.grail,[art.goat,art.caseHit],'grails');
    if(theme.mode==='case')addFullScene(doc,slide,art.caseHit,[art.downtown,art.grail],'case');
    if(theme.mode==='downtown')addFullScene(doc,slide,art.downtown,[art.caseHit,art.goat],'downtown');
    if(theme.mode==='break')addBreakScene(doc,slide,art.breakCards||[]);
    if(theme.mode==='pokemon')addPokemonScene(doc,slide);
   }else{slide.style.display='none';slide.classList.remove('active')}
  });
  let rail=doc.getElementById('csThemeRail');if(!rail){rail=doc.createElement('div');rail.id='csThemeRail';hero.appendChild(rail)}
  const active=slides.slice(0,7);const show=i=>{i=((i%7)+7)%7;active.forEach((s,n)=>s.classList.toggle('active',n===i));const d=HOME_THEMES[i],k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));win.__csThemeIndex=i;hero.classList.remove('strike');void hero.offsetWidth;hero.classList.add('strike')};
  rail.innerHTML='';HOME_THEMES.forEach((d,i)=>{const b=doc.createElement('button');b.className='csThemeBtn';b.type='button';b.textContent=d.title;b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};rail.appendChild(b)});win.setSlide=show;if(!win.__csCollectorThemeInstalled){win.__csCollectorThemeInstalled=true;show(0)}
 }catch(e){console.error('CardStorm theme patch failed',e)}
}
function patchCards(doc){try{ensureStyles(doc);doc.querySelectorAll('.grid .card').forEach((c,i)=>c.dataset.csIndex=String(i+1).padStart(2,'0'));doc.querySelectorAll('#view .top .nav button').forEach(b=>{if((b.textContent||'').trim().toUpperCase()==='TCG')b.style.display='none'})}catch(e){}}
function patchInternalBack(win,doc){try{const path=((doc.location&&doc.location.pathname)||'').toLowerCase();if(!path.endsWith('/app.html')&&!path.endsWith('app.html'))return;doc.querySelectorAll('button,a').forEach(el=>{if(el.dataset.csReturnHome)return;const t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();const isReturn=t==='home'||t==='back'||t.includes('back to command center')||t.includes('back to cardstorm')||t.includes('cardstorm home')||t.includes('command center');if(!isReturn)return;el.dataset.csReturnHome='1';el.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();returnToNewHome()},true)})}catch(e){}}
function patchPage(win,doc){try{if(!win||!doc)return;patchHomepageThemes(win,doc);patchCards(doc);patchInternalBack(win,doc);doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}});try{win.startTrial=stripe}catch(e){};doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csCollectorFix){fr.dataset.csCollectorFix='1';fr.addEventListener('load',()=>{try{patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){console.error('CardStorm patch failed',e)}}
function patchAll(){try{patchPage(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,450);setTimeout(patchAll,1400)});
</script>
</body>
</html>
