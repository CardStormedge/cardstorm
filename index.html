<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CardStorm Command Center</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}
</style>
</head>
<body>
<iframe id="core" src="app-core.html" title="CardStorm Command Center"></iframe>
<script>
const STRIPE_EDGE_MONTHLY='https://buy.stripe.com/7sYeV6gwLagoa6md0ocjS00';
const core=document.getElementById('core');
let coreReady=false,pendingSection=null;
function patchCore(){
  try{
    const w=core.contentWindow,d=core.contentDocument;
    if(!w||!d)return;
    const style=d.createElement('style');
    style.textContent='.ownerSetup,.domainStatus{display:none!important}.trialbuttons .cta{display:none!important}.trialbuttons{grid-template-columns:1fr!important}.plan.edge .trialterms{margin-top:12px}';
    d.head.appendChild(style);
    w.startTrial=function(){window.open(STRIPE_EDGE_MONTHLY,'_blank','noopener,noreferrer')};
    coreReady=true;
    if(pendingSection&&typeof w.show==='function'){w.show(pendingSection);pendingSection=null;}
  }catch(e){console.error('CardStorm payment patch failed',e)}
}
core.addEventListener('load',patchCore);
function show(section){pendingSection=section||null;try{const w=core.contentWindow;if(coreReady&&typeof w.show==='function'){w.show(section);pendingSection=null;}}catch(e){}}
function home(){try{const w=core.contentWindow;if(typeof w.home==='function')w.home();}catch(e){}}
</script>
</body>
</html>
