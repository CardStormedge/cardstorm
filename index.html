<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="description" content="CardStorm collector intelligence">
<title>CardStorm Edge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}
#core{display:block;width:100%;height:100%;border:0;background:#020914}
</style>
</head>
<body>
<iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe>
<script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const core=document.getElementById('core');

function stripe(){ top.location.href=STRIPE; }

function hideDuplicateTcgTab(doc){
  try{
    // Keep the main POKEMON / TCG destination. Hide only the duplicate
    // inner-page navigation button whose visible label is exactly "TCG".
    doc.querySelectorAll('#view .top .nav button').forEach(btn=>{
      if((btn.textContent||'').trim().toUpperCase()==='TCG'){
        btn.style.display='none';
      }
    });
  }catch(e){}
}

function patchPaymentsOnly(win,doc){
  try{
    if(!win||!doc)return;

    hideDuplicateTcgTab(doc);

    // IMPORTANT: do not replace logos, hero images, page imagery, navigation,
    // Pokemon content, or native app routing here. Each page owns its visuals.
    doc.querySelectorAll('a[href],button').forEach(el=>{
      const t=(el.textContent||'').trim().toLowerCase();
      if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){
        el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};
        if(el.tagName==='A')el.href=STRIPE;
      }
    });

    try{ win.startTrial=stripe; }catch(e){}

    doc.querySelectorAll('iframe').forEach(fr=>{
      if(!fr.dataset.csPaymentPatch){
        fr.dataset.csPaymentPatch='1';
        fr.addEventListener('load',()=>{
          try{ patchPaymentsOnly(fr.contentWindow,fr.contentDocument); }catch(e){}
        });
      }
      try{
        if(fr.contentDocument)patchPaymentsOnly(fr.contentWindow,fr.contentDocument);
      }catch(e){}
    });
  }catch(e){
    console.error('CardStorm payment patch failed',e);
  }
}

function patchAll(){
  try{ patchPaymentsOnly(core.contentWindow,core.contentDocument); }catch(e){}
}

core.addEventListener('load',()=>{
  patchAll();
  setTimeout(patchAll,300);
  setTimeout(patchAll,1200);
});
</script>
</body>
</html>
