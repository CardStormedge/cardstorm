<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020914"><meta name="description" content="CardStorm gives collectors card-market intelligence, verified set data, chase guidance and collector tools."><title>CardStorm Edge</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}</style></head><body><iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe><script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const LOGO='assets/logo-approved.webp';
const core=document.getElementById('core');
function stripe(){top.location.href=STRIPE}
function installHeroRotation(win,doc){
  try{
    const slides=[...doc.querySelectorAll('.hero .slide')];
    if(slides.length<2)return;
    const heroData=[
      {name:'Travis Hunter',kicker:'NFL • JACKSONVILLE JAGUARS',sub:'Two-way electricity in Jacksonville. Football remains the heartbeat of the CardStorm chase.',img:'assets/herocardfootball.webp',team:'Jaguars',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/jax.png'},
      {name:'Jaxon Dart',kicker:'NFL • NEW YORK GIANTS',sub:'Quarterback upside, rookie-card heat and a chase collectors are watching.',img:'assets/boxes/box-football-2025-donrussoptic.webp',team:'Giants',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/nyg.png'},
      {name:'Ashton Jeanty',kicker:'NFL • LAS VEGAS RAIDERS',sub:'Explosive rookie demand with inserts, parallels, autos and numbered upside.',img:'assets/boxes/box-football-2026-prizm.webp',team:'Raiders',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/lv.png'},
      {name:'Tom Brady',kicker:'NFL • NEW ENGLAND PATRIOTS',sub:'The GOAT benchmark. Icon cards define the ceiling modern football chases are measured against.',img:'assets/boxes/box-football-2024-donruss.webp',team:'Patriots',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/ne.png'},
      {name:'Jayden Daniels',kicker:'NFL • WASHINGTON COMMANDERS',sub:'Elite quarterback demand and premium rookie-card attention across the football hobby.',img:'assets/boxes/box-football-2026-select.webp',team:'Commanders',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/wsh.png'},
      {name:'Cam Ward',kicker:'NFL • TENNESSEE TITANS',sub:'New-generation quarterback chase with the kind of upside collectors track early.',img:'assets/boxes/box-football-2026-toppsresurgence.webp',team:'Titans',teamLogo:'https://a.espncdn.com/i/teamlogos/nfl/500/ten.png'},
      {name:'Paul Skenes',kicker:'MLB • PITTSBURGH PIRATES',sub:'One baseball slot, one monster arm. Skenes brings the modern baseball chase into the Storm.',img:'assets/boxes/box-baseball-2026-toppschrome.webp',team:'Pirates',teamLogo:'https://a.espncdn.com/i/teamlogos/mlb/500/pit.png'},
      {name:'Victor Wembanyama',kicker:'NBA • SAN ANTONIO SPURS',sub:'Wemby gives CardStorm a basketball anchor with true hobby-scale star power.',img:'assets/boxes/box-basketball-2026-toppschrome.webp',team:'Spurs',teamLogo:'https://a.espncdn.com/i/teamlogos/nba/500/sas.png'},
      {name:'Pikachu + Charizard',kicker:'POKÉMON • ICON CHASE',sub:'The two names that instantly tell collectors CardStorm covers the TCG chase too.',img:'assets/pokemontcglogo.webp',team:'Pokémon',teamLogo:'assets/pokemontcglogo.webp'}
    ];
    slides.forEach((slide,i)=>{
      const d=heroData[i%heroData.length];
      slide.dataset.player=d.name;slide.dataset.kicker=d.kicker;slide.dataset.sub=d.sub;slide.dataset.team=d.team;
      const img=slide.querySelector('.heroimg');
      if(img){img.src=d.img;img.alt=d.name+' — '+d.team;img.onerror=()=>{img.onerror=null;img.src='assets/herocardfootball.webp'}}
      let badge=slide.querySelector('.csTeamBadge');
      if(!badge){badge=doc.createElement('div');badge.className='csTeamBadge';badge.innerHTML='<img><span></span>';slide.appendChild(badge)}
      const badgeImg=badge.querySelector('img'),badgeText=badge.querySelector('span');
      if(badgeImg){badgeImg.src=d.teamLogo;badgeImg.alt=d.team+' logo';badgeImg.onerror=()=>{badgeImg.style.display='none'}}
      if(badgeText)badgeText.textContent=d.team;
    });
    if(!doc.getElementById('csHeroFit')){
      const st=doc.createElement('style');st.id='csHeroFit';st.textContent='.hero .slide .heroimg{object-fit:cover!important;object-position:center!important;padding:0!important}.hero .slide.categorySlide .heroimg{object-fit:cover!important;object-position:center!important;padding:0!important}.csTeamBadge{position:absolute;z-index:7;right:clamp(22px,4vw,64px);top:clamp(22px,4vw,48px);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(2,9,20,.82);backdrop-filter:blur(12px);box-shadow:0 10px 35px rgba(0,0,0,.42)}.csTeamBadge img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(85,216,255,.25))}.csTeamBadge span{font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#fff}.dots{gap:8px!important;align-items:center}.dot{width:38px!important;height:38px!important;border-radius:10px!important;background:#071522!important;border:1px solid #31516a!important;display:grid!important;place-items:center!important;overflow:hidden!important}.dot img{width:30px!important;height:30px!important;object-fit:contain!important}.dot.active{border-color:#55d8ff!important;box-shadow:0 0 14px rgba(85,216,255,.72)!important;background:#0a2741!important}@media(max-width:760px){.csTeamBadge{top:18px;right:18px;padding:6px 9px}.csTeamBadge img{width:38px;height:38px}.csTeamBadge span{display:none}.dot{width:32px!important;height:32px!important}.dot img{width:25px!important;height:25px!important}}';doc.head.appendChild(st)
    }
    const dots=[...doc.querySelectorAll('.dot')];
    dots.forEach((dot,i)=>{
      const d=heroData[i%heroData.length];
      dot.innerHTML='';
      const logo=doc.createElement('img');logo.src=d.teamLogo;logo.alt=d.team+' thumbnail';logo.loading='eager';logo.onerror=()=>{logo.style.display='none';dot.textContent=String(i+1)};dot.appendChild(logo);dot.title=d.name+' — '+d.team;
    });
    const showSlide=(idx)=>{
      const i=((idx%slides.length)+slides.length)%slides.length;
      slides.forEach((s,n)=>s.classList.toggle('active',n===i));
      const d=heroData[i%heroData.length];
      const kicker=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub'),name=doc.getElementById('starName'),num=doc.getElementById('slideNum');
      if(kicker)kicker.textContent=d.kicker;if(sub)sub.textContent=d.sub;if(name)name.textContent=d.name;if(num)num.textContent='FEATURED CHASE '+String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
      doc.querySelectorAll('.dot').forEach((dot,n)=>dot.classList.toggle('active',n===i));
      win.__csHeroIndex=i;
      const hero=doc.getElementById('hero');if(hero){hero.classList.remove('strike');void hero.offsetWidth;hero.classList.add('strike')}
    };
    if(!win.__csHeroRotationInstalled){
      win.__csHeroRotationInstalled=true;win.__csHeroIndex=0;showSlide(0);
      win.__csHeroTimer=setInterval(()=>showSlide((win.__csHeroIndex||0)+1),6000);
      doc.addEventListener('click',e=>{const dot=e.target.closest&&e.target.closest('.dot');if(dot){const ds=[...doc.querySelectorAll('.dot')],i=ds.indexOf(dot);if(i>=0)showSlide(i)}},true);
    }
  }catch(e){console.error('Hero rotation patch failed',e)}
}
function addCommandCenterBack(win,doc){
  try{
    const path=((doc.location&&doc.location.pathname)||'').toLowerCase();
    if(!path.endsWith('/app.html')&&!path.endsWith('app.html'))return;
    if(doc.getElementById('csCommandCenterBack'))return;
    const btn=doc.createElement('button');btn.id='csCommandCenterBack';btn.type='button';btn.textContent='← CARDSTORM COMMAND CENTER';btn.setAttribute('aria-label','Back to CardStorm Command Center');
    btn.style.cssText='position:fixed;top:12px;left:12px;z-index:2147483647;padding:10px 14px;border-radius:10px;border:1px solid #55d8ff;background:rgba(2,9,20,.96);color:#fff;font:900 12px/1.1 Segoe UI,Arial,sans-serif;letter-spacing:.02em;box-shadow:0 0 20px rgba(85,216,255,.28);cursor:pointer;';
    btn.onclick=e=>{e.preventDefault();e.stopPropagation();try{const p=win.parent;if(p&&p!==win){try{if(typeof p.closeApp==='function'){p.closeApp();return}}catch(_e){}try{const layer=p.document.querySelector('.appLayer');if(layer){layer.classList.remove('open');layer.style.display='none';return}}catch(_e){}}}catch(_e){}try{top.location.href='/'}catch(_e){location.href='/'}};
    doc.body.appendChild(btn);
  }catch(e){console.error('Back button injection failed',e)}
}
function injectCatalog(doc){try{const path=(doc.location&&doc.location.pathname)||'';if(!path.endsWith('/app.html')&&!path.endsWith('app.html'))return;if(doc.getElementById('cardstormSetCatalog'))return;const a=doc.createElement('script');a.id='cardstormSetCatalog';a.src='data/set-catalog.js';a.onload=()=>{const b=doc.createElement('script');b.id='cardstormSetUi';b.src='data/set-ui-patch.js';doc.head.appendChild(b)};doc.head.appendChild(a)}catch(e){console.error('Catalog injection failed',e)}}
function patchDoc(win,doc){
  try{
    if(!win||!doc)return;
    doc.querySelectorAll('img').forEach(img=>{const s=(img.getAttribute('src')||'').toLowerCase(),a=(img.getAttribute('alt')||'').toLowerCase();if(s.includes('assets/logo')||a.includes('cardstorm logo')||a==='cardstorm')img.src=LOGO;});
    installHeroRotation(win,doc);
    doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE;}});
    try{win.startTrial=stripe}catch(e){}
    doc.querySelectorAll('.ownerSetup,.domainStatus').forEach(el=>el.style.display='none');
    doc.querySelectorAll('.plan.edge').forEach(edge=>{const big=edge.querySelector('.big');if(big)big.textContent='$9.88';const sub=edge.querySelector('.sub');if(sub)sub.textContent='per month after 7-day free trial • cancel anytime';});
    try{if(Array.isArray(win.GAME_POOL)){win.GAME_POOL=win.GAME_POOL.filter(c=>c&&c.img);if(Array.isArray(win.GAMECARDS))win.GAMECARDS=win.GAME_POOL.slice()}}catch(e){}
    injectCatalog(doc);addCommandCenterBack(win,doc);
    doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csPatched){fr.dataset.csPatched='1';fr.addEventListener('load',()=>{try{patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchDoc(fr.contentWindow,fr.contentDocument)}catch(e){}});
  }catch(e){console.error('CardStorm patch failed',e)}
}
function patchAll(){try{patchDoc(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,300);setTimeout(patchAll,1000);setTimeout(patchAll,2500)});
setInterval(patchAll,1500);
</script></body></html>
