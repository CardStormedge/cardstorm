<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardStorm Edge</title><style>html,body{margin:0;height:100%;background:#020814}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe><script>
const LOGO='assets/logo-approved.webp';
const HERO=[
  'assets/hero/hero-rookie.webp',
  'assets/hero/hero-grails.webp',
  'assets/hero/hero-goat.webp',
  'assets/hero/promo-break-game.webp',
  'assets/hero/hero-pokemon.webp'
];
const f=document.getElementById('core');
f.addEventListener('load',()=>{try{const d=f.contentDocument||f.contentWindow.document;
  d.querySelectorAll('img').forEach(img=>{const s=(img.getAttribute('src')||'').toLowerCase();const alt=(img.getAttribute('alt')||'').toLowerCase();if(s.includes('logo')||alt.includes('cardstorm')) img.src=LOGO;});
  const heroImgs=[...d.querySelectorAll('.slide .heroimg')]; heroImgs.forEach((img,i)=>img.src=HERO[i%HERO.length]);
  d.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial'].some(x=>t.includes(x))){el.onclick=(e)=>{e.preventDefault();top.location.href='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';};if(el.tagName==='A')el.href='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';}});
  const w=f.contentWindow;
  const patchGame=()=>{try{if(Array.isArray(w.GAME_POOL)){w.GAME_POOL=w.GAME_POOL.filter(c=>c&&c.img);if('GAMECARDS' in w)w.GAMECARDS=w.GAME_POOL;}}catch(e){}};patchGame();setInterval(patchGame,1000);
}catch(e){console.error(e);}});
</script></body></html>
