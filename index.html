let GAME_ART=null;
function stripe(){top.location.href=STRIPE}
function loadGameArt(){if(GAME_ART)return Promise.resolve(GAME_ART);return fetch('game-data.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const cards=(Array.isArray(data)?data:[]).filter(c=>c&&c.img&&String(c.img).startsWith('data:image'));const byValue=[...cards].sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0));const caseHit=byValue.find(c=>/downtown|kaboom|color blast|manga|genesis|stained glass|ssp|case hit/i.test(c.card||''))||byValue[0];GAME_ART={cards:byValue.slice(0,12),caseHit};return GAME_ART}).catch(()=>GAME_ART={cards:[]});}
function install(doc,win){
 try{

   @media(max-width:760px){.hero{min-height:690px!important}.heroCopy{padding-bottom:145px!important}.csAthlete{width:78%;height:52%;right:-4%;bottom:auto;top:3%}.csSlab{width:54%;height:37%;right:7%;top:7%}.csBreakWall,.csGameStage{width:76%;height:45%;right:-5%;top:2%}.csPokemon{width:75%;height:45%;right:-5%;top:2%}.csThemeBtn{padding:8px 9px;font-size:9px}.funStrip{grid-template-columns:1fr!important}}
   @media(max-width:500px){.grid{grid-template-columns:1fr!important}}
   `;doc.head.appendChild(st);
  }
  const logo=doc.querySelector('.brand img');if(logo){logo.src='assets/logo.png';logo.alt='CardStorm — AI-Powered Card Value Intelligence'}
  loadGameArt().then(art=>{
   all.slice(0,9).forEach((slide,i)=>{
    const d=THEMES[i];slide.style.display='block';slide.dataset.player=d.title;slide.dataset.kicker=d.kicker;slide.dataset.sub=d.sub;slide.style.setProperty('--accent',d.accent);slide.querySelectorAll('.csHeroVisual').forEach(x=>x.remove());const old=slide.querySelector('.heroimg');if(old)old.style.display='none';const v=doc.createElement('div');v.className='csHeroVisual';const arena=doc.createElement('div');arena.className='csArena';v.appendChild(arena);
    if(d.mode==='football'){const im=doc.createElement('img');im.className='csFootballBase';im.src=d.img;im.alt='Rising rookie football chase';v.appendChild(im)}

    else if(d.mode==='break'){const wall=doc.createElement('div');wall.className='csBreakWall';wall.innerHTML='<div class="screen"></div><div class="chat"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="cards"></div>';v.appendChild(wall)}
    else if(d.mode==='game'){const stage=doc.createElement('div');stage.className='csGameStage';for(let n=0;n<3;n++){const c=doc.createElement('div');c.className='csRankCard';c.dataset.rank=n===0?'HIGHEST?':n===1?'MIDDLE?':'LOWEST?';const g=art&&art.cards&&art.cards[n];if(g&&g.img){const im=doc.createElement('img');im.src=g.img;im.alt='Card comparison';c.appendChild(im)}else{const b=doc.createElement('b');b.textContent='?';c.appendChild(b)}stage.appendChild(c)}v.appendChild(stage)}

   all.slice(9).forEach(s=>{s.style.display='none';s.classList.remove('active')});
   let rail=hero.querySelector('#csThemeRail');if(!rail){rail=doc.createElement('div');rail.id='csThemeRail';hero.appendChild(rail)}rail.innerHTML='';
   let idx=0;function show(n){idx=((n%9)+9)%9;all.slice(0,9).forEach((s,j)=>s.classList.toggle('active',j===idx));const d=THEMES[idx];hero.style.setProperty('--accent',d.accent);const k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub'),name=doc.getElementById('starName'),num=doc.getElementById('slideNum');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;if(name)name.textContent=d.title;if(num)num.textContent='COLLECTOR LANE '+String(idx+1).padStart(2,'0')+' / 09';[...rail.children].forEach((b,j)=>b.classList.toggle('active',j===idx));win.__csGuideIndex=idx;hero.classList.remove('strike');void hero.offsetWidth;hero.classList.add('strike')}
   THEMES.forEach((d,i)=>{const b=doc.createElement('button');b.className='csThemeBtn';b.type='button';b.textContent=d.title;b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};rail.appendChild(b)});
   win.setSlide=show;if(!win.__csGuideTimer){win.__csGuideTimer=setInterval(()=>show((win.__csGuideIndex||0)+1),6500)}show(0)

  const cards=[...doc.querySelectorAll('.grid .card')];cards.forEach(c=>{const t=(c.textContent||'').toLowerCase();if(t.includes('pokémon')||t.includes('pokemon'))c.dataset.csHide='1';if(t.includes('cards come alive'))c.dataset.csHide='1'});

function patch(){try{const w=core.contentWindow,d=core.contentDocument;if(w&&d)install(d,w)}catch(e){}}
