<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="description" content="CardStorm collector intelligence">
<title>CardStorm Edge</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914}#core{display:block;width:100%;height:100%;border:0;background:#020914}</style>
</head>
<body>
<iframe id="core" src="app-core.html" title="CardStorm Edge"></iframe>
<script>
const STRIPE='https://buy.stripe.com/8x228k6Wb4W4diyaSgcjS01';
const core=document.getElementById('core');
const HEROES=[
 {name:'Travis Hunter',kicker:'NFL • JACKSONVILLE JAGUARS',sub:'Two-way rookie electricity. The first CardStorm chase and the visual standard for the homepage.',img:'assets/herocardfootball.webp',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/jax.png',team:'Jaguars',local:true},
 {name:'Jaxson Dart',kicker:'NFL • NEW YORK GIANTS',sub:'Giants blue. Number 6. Quarterback power and one of the rookie chases collectors are watching hardest.',img:'https://a.espncdn.com/i/headshots/nfl/players/full/4689114.png',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/nyg.png',team:'Giants'},
 {name:'Tom Brady',kicker:'NFL • GOAT CHASE',sub:'The benchmark for football grails, iconic cards and the ceiling every modern quarterback chase is measured against.',img:'https://a.espncdn.com/i/headshots/nfl/players/full/2330.png',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/ne.png',team:'Patriots'},
 {name:'Ashton Jeanty',kicker:'NFL • LAS VEGAS RAIDERS',sub:'Built Different. Rookie inserts, numbered parallels and autos make Jeanty a perfect CardStorm learning chase.',img:'https://a.espncdn.com/i/headshots/nfl/players/full/4890973.png',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/lv.png',team:'Raiders'},
 {name:'Jayden Daniels',kicker:'NFL • WASHINGTON COMMANDERS',sub:'Breakout-star demand, premium rookie attention and the kind of card ladder collectors need to understand.',img:'https://a.espncdn.com/i/headshots/nfl/players/full/4426348.png',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/wsh.png',team:'Commanders'},
 {name:'Patrick Mahomes',kicker:'NFL • MODERN GRAIL',sub:'Modern hobby royalty. Mahomes anchors the jump from rookie chase to true collection centerpiece.',img:'https://a.espncdn.com/i/headshots/nfl/players/full/3139477.png',logo:'https://a.espncdn.com/i/teamlogos/nfl/500/kc.png',team:'Chiefs'}
];
function stripe(){top.location.href=STRIPE}
function returnHome(){try{const w=core.contentWindow,d=core.contentDocument;const layer=d&&d.getElementById('appLayer');if(layer)layer.classList.remove('open');if(d)d.body.style.overflow='';if(w&&typeof w.scheduleStorm==='function')w.scheduleStorm(true);if(w)w.scrollTo(0,0)}catch(e){}}
function installHomepage(win,doc){
 try{
  const hero=doc.querySelector('.hero');
  const allSlides=[...doc.querySelectorAll('.hero .slide')];
  if(!hero||allSlides.length<6)return;
  const slides=allSlides.slice(0,6);
  allSlides.slice(6).forEach(s=>{s.style.display='none';s.classList.remove('active')});
  if(!doc.getElementById('csSixStarHome')){
   const st=doc.createElement('style');st.id='csSixStarHome';st.textContent=`
   .brand{min-width:260px!important}.brand img{height:62px!important;max-width:300px!important;width:auto!important}
   .hero .slide{background:radial-gradient(circle at 78% 38%,rgba(46,146,220,.28),transparent 30%),linear-gradient(125deg,#020914 0%,#071827 48%,#102b42 73%,#020914 100%)!important;overflow:hidden!important}
   .hero .slide .heroimg{padding:0!important;z-index:2!important}
   .hero .slide:not(:first-child) .heroimg{position:absolute!important;left:auto!important;right:1%!important;top:auto!important;bottom:-3%!important;width:55%!important;height:94%!important;object-fit:contain!important;object-position:center bottom!important;filter:drop-shadow(0 32px 44px rgba(0,0,0,.92)) drop-shadow(0 0 32px rgba(85,216,255,.24)) saturate(1.08) contrast(1.08)!important}
   .hero .slide:first-child .heroimg{object-fit:cover!important;object-position:center 35%!important}
   .csTeamMark{position:absolute;z-index:1;right:7%;top:7%;width:38%;height:77%;object-fit:contain;opacity:.15;filter:drop-shadow(0 0 42px rgba(85,216,255,.5));transform:rotate(-7deg) scale(1.08)}
   .csStormClouds{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 76% 18%,rgba(129,204,255,.22),transparent 27%),radial-gradient(ellipse at 88% 72%,rgba(44,104,151,.3),transparent 34%),linear-gradient(100deg,transparent 44%,rgba(3,11,20,.08) 58%,rgba(3,11,20,.72) 100%);mix-blend-mode:screen}
   .csSlabBreak{position:absolute;z-index:2;right:8%;bottom:4%;width:40%;height:59%;border:2px solid rgba(185,237,255,.19);border-radius:22px;transform:rotate(-5deg);box-shadow:0 0 0 9px rgba(255,255,255,.02),0 0 48px rgba(71,184,255,.14),inset 0 0 34px rgba(255,255,255,.04);opacity:.72}
   .csShards{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(128deg,transparent 54%,rgba(225,249,255,.2) 54.2%,transparent 54.8%),linear-gradient(42deg,transparent 68%,rgba(255,255,255,.14) 68.3%,transparent 68.8%),linear-gradient(155deg,transparent 77%,rgba(85,216,255,.17) 77.3%,transparent 77.8%),linear-gradient(24deg,transparent 84%,rgba(255,255,255,.1) 84.2%,transparent 84.6%)}
   .csTeamBadge{position:absolute;z-index:8;right:clamp(22px,4vw,64px);top:clamp(22px,4vw,48px);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(2,9,20,.84);backdrop-filter:blur(12px);box-shadow:0 10px 35px rgba(0,0,0,.45)}
   .csTeamBadge img{width:48px;height:48px;object-fit:contain}.csTeamBadge span{font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#fff}
   .starPlate span{font-size:0!important}.starPlate span:after{content:'Six stars. Six distinct chases. Team identity stays visible.';font-size:12px!important}
   .dots{gap:8px!important}.dot{width:38px!important;height:38px!important;border-radius:10px!important;border:1px solid #31516a!important;background:#071522!important;display:grid!important;place-items:center!important;overflow:hidden!important}.dot img{width:30px!important;height:30px!important;object-fit:contain!important}.dot.active{border-color:#55d8ff!important;background:#0a2741!important;box-shadow:0 0 14px rgba(85,216,255,.72)!important}
   .csBreakFeature{border-color:#3278a8!important;background:radial-gradient(circle at 88% 18%,rgba(85,216,255,.13),transparent 35%),linear-gradient(150deg,#0a2948,#05101c)!important}.csBreakFeature .eyebrow{color:#55d8ff!important}
   @media(max-width:760px){.brand{min-width:auto!important}.brand img{height:48px!important;max-width:190px!important}.hero .slide:not(:first-child) .heroimg{width:78%!important;height:51%!important;right:-2%!important;bottom:auto!important;top:3%!important}.csTeamMark{width:56%;height:47%;right:3%;top:2%}.csSlabBreak{width:53%;height:35%;right:8%;top:8%;bottom:auto}.csTeamBadge{top:16px;right:16px;padding:6px 8px}.csTeamBadge img{width:36px;height:36px}.csTeamBadge span{display:none}.dot{width:32px!important;height:32px!important}.dot img{width:25px!important;height:25px!important}}
   `;doc.head.appendChild(st);
  }
  slides.forEach((slide,i)=>{
   const d=HEROES[i];slide.style.display='block';slide.dataset.player=d.name;slide.dataset.kicker=d.kicker;slide.dataset.sub=d.sub;
   let img=slide.querySelector('.heroimg');if(!img){img=doc.createElement('img');img.className='heroimg';slide.prepend(img)}
   img.src=d.img;img.alt=d.name+' — '+d.team;img.onerror=()=>{img.onerror=null;img.src='assets/herocardfootball.webp'};
   let mark=slide.querySelector('.csTeamMark');if(!mark){mark=doc.createElement('img');mark.className='csTeamMark';slide.appendChild(mark)}mark.src=d.logo;mark.alt='';
   if(!slide.querySelector('.csStormClouds')){const x=doc.createElement('div');x.className='csStormClouds';slide.appendChild(x)}
   if(!slide.querySelector('.csSlabBreak')){const x=doc.createElement('div');x.className='csSlabBreak';slide.appendChild(x)}
   if(!slide.querySelector('.csShards')){const x=doc.createElement('div');x.className='csShards';slide.appendChild(x)}
   let badge=slide.querySelector('.csTeamBadge');if(!badge){badge=doc.createElement('div');badge.className='csTeamBadge';badge.innerHTML='<img><span></span>';slide.appendChild(badge)}badge.querySelector('img').src=d.logo;badge.querySelector('span').textContent=d.team;
  });
  const dots=doc.getElementById('dots');if(dots){dots.innerHTML='';HEROES.forEach((d,i)=>{const b=doc.createElement('button');b.className='dot'+(i===0?' active':'');b.type='button';b.setAttribute('aria-label','Show '+d.name);const im=doc.createElement('img');im.src=d.logo;im.alt=d.team;b.appendChild(im);b.onclick=e=>{e.preventDefault();e.stopPropagation();show(i)};dots.appendChild(b)})}
  let idx=0;function show(n){idx=((n%6)+6)%6;slides.forEach((s,i)=>s.classList.toggle('active',i===idx));const d=HEROES[idx],k=doc.getElementById('heroKicker'),sub=doc.getElementById('heroSub'),name=doc.getElementById('starName'),num=doc.getElementById('slideNum');if(k)k.textContent=d.kicker;if(sub)sub.textContent=d.sub;if(name)name.textContent=d.name;if(num)num.textContent='FEATURED CHASE '+String(idx+1).padStart(2,'0')+' / 06';if(dots)[...dots.children].forEach((x,i)=>x.classList.toggle('active',i===idx));hero.classList.remove('strike');void hero.offsetWidth;hero.classList.add('strike')}
  win.setSlide=show;win.__csHeroIndex=0;if(!win.__csSixTimer){win.__csSixTimer=setInterval(()=>{win.__csHeroIndex=(win.__csHeroIndex+1)%6;show(win.__csHeroIndex)},6200)}show(0);
  const brand=doc.querySelector('.brand img');if(brand)brand.src='assets/logo-horizontal.webp';
  const cards=[...doc.querySelectorAll('.grid .card')];const gameCard=cards.find(c=>/CardStorm Challenge/i.test(c.textContent||''));if(gameCard){const p=gameCard.querySelector('p');if(p)p.textContent='10 rounds. Rank three real card examples from highest recent sale to lowest and learn why one hit beats another.'}
  const liveCard=cards.find(c=>/Cards Come Alive/i.test(c.textContent||''));if(liveCard){const h=liveCard.querySelector('h3'),p=liveCard.querySelector('p');if(h)h.textContent='Break Center';if(p)p.textContent='A separate breaker lane for finding live breaks, chats and communities — built to help breakers fill spots and collectors find action.';liveCard.classList.add('csBreakFeature')}
  const features=[...doc.querySelectorAll('.funStrip .feature')];if(features[0]){features[0].classList.add('csBreakFeature');const e=features[0].querySelector('.eyebrow'),h=features[0].querySelector('h3'),p=features[0].querySelector('p'),b=features[0].querySelector('button');if(e)e.textContent='⚡ BREAK CENTER';if(h)h.textContent='Find the break. Find the chat.';if(p)p.textContent='Breaker promotion and break discovery are their own CardStorm feature — separate from the educational game.';if(b){b.textContent='BREAK CENTER — BUILD NEXT';b.onclick=e=>{e.preventDefault()}}}
  if(features[1]){const h=features[1].querySelector('h3'),p=features[1].querySelector('p');if(h)h.textContent='Can you rank the hits correctly?';if(p)p.textContent='Ten educational rounds. Three related cards each round. Rank highest sale to lowest, then learn the insert, parallel, numbering and autograph clues that explain the result.'}
 }catch(e){console.error('CardStorm homepage patch failed',e)}
}
function patchPage(win,doc){try{if(!win||!doc)return;installHomepage(win,doc);doc.querySelectorAll('a[href],button').forEach(el=>{const t=(el.textContent||'').trim().toLowerCase();if(['join cardstorm','plans','start trial','start free trial','7-day trial'].some(x=>t.includes(x))){el.onclick=e=>{e.preventDefault();e.stopPropagation();stripe()};if(el.tagName==='A')el.href=STRIPE}});try{win.startTrial=stripe}catch(e){};doc.querySelectorAll('iframe').forEach(fr=>{if(!fr.dataset.csHomePatch){fr.dataset.csHomePatch='1';fr.addEventListener('load',()=>{try{patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}try{if(fr.contentDocument)patchPage(fr.contentWindow,fr.contentDocument)}catch(e){}})}catch(e){}}
function patchAll(){try{patchPage(core.contentWindow,core.contentDocument)}catch(e){}}
core.addEventListener('load',()=>{patchAll();setTimeout(patchAll,500);setTimeout(patchAll,1500)});
</script>
</body>
</html>
